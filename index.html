  });
}

playBtn.addEventListener('click', () => {
  if (player.playing) stopPlayback();
  else startPlayback();
});

// ===== タイミング調整 =====
// 一定の間隔のクリック音に合わせてタップしてもらい、クリック音とのずれの中央値を、この端末の遅れとして保存する
// （画面に触れてから届くまでの遅れ、Bluetoothイヤホンなどで音が遅れて聞こえる分をまとめて測る）
const CALIB_TAPS = 8;          // 何回タップしてもらうか
const CALIB_INTERVAL = 0.6;    // クリックの間隔（秒）
const CALIB_CLICKS = 30;       // クリックの最大数（足りなければ測り直し）
const calib = { open: false, clicks: [], sounds: [], deltas: [], result: null, timer: null };
const calibOverlay = document.getElementById('calibOverlay');
const calibPad = document.getElementById('calibPad');

function calibText(offset) {
  const ms = Math.round(offset * 1000);
  if (ms === 0) return 'ずれ 0秒';
  return `ずれ ${(Math.abs(offset)).toFixed(2)}秒（${ms > 0 ? '遅め' : '早め'}）`;
}
function setCalibButtons(phase) {
  document.getElementById('calibSave').hidden = phase !== 'done';
  document.getElementById('calibRetry').hidden = phase === 'running';
  calibPad.disabled = phase !== 'running';
}

function openCalib() {
  stopPlayback();
  calib.open = true;
  calibOverlay.classList.remove('hidden');
  startCalib();
}
function startCalib() {
  initAudio();
  stopCalibSounds();
  calib.deltas = [];
  calib.result = null;
  const t0 = ctx.currentTime + 0.5;
  calib.clicks = [];
  for (let i = 0; i < CALIB_CLICKS; i++) {
    const t = t0 + i * CALIB_INTERVAL;
    calib.clicks.push(t);
    calib.sounds.push(makeClick(t, i % 4 === 0));
  }
  document.getElementById('calibText').textContent =
    `「プッ」という音に合わせて、下のボタンを${CALIB_TAPS}回タップしてください（PCはどのキーでも可）。音を聴きながら、いつも通りのタイミングで押すのがコツです`;
  document.getElementById('calibProgress').textContent = `0 / ${CALIB_TAPS}`;
  setCalibButtons('running');
  // クリックが終わっても足りなければ、測り直してもらう
  clearTimeout(calib.timer);
  calib.timer = setTimeout(() => {
    if (!calib.open || calib.result !== null) return;
    document.getElementById('calibText').textContent = 'うまく測れませんでした。「やり直す」を押して、音に合わせてタップしてください';
    setCalibButtons('failed');
  }, (t0 - ctx.currentTime + CALIB_CLICKS * CALIB_INTERVAL + 0.3) * 1000);
}
function stopCalibSounds() {
  if (ctx) {
    const now = ctx.currentTime;
    for (const v of calib.sounds) if (v.end > now) v.oscs.forEach((o) => { try { o.stop(now); } catch (e) {} });
  }
  calib.sounds = [];
}
function closeCalib() {
  calib.open = false;
  clearTimeout(calib.timer);
  stopCalibSounds();
  calibOverlay.classList.add('hidden');
  showSong();
}

// タップした時刻を、いちばん近いクリックと比べる。半間隔より離れたタップ（打ち間違い）は数えない
function calibTap(perfMs) {
  if (!calib.open || calib.result !== null || !ctx) return;
  const t = audioTimeAt(perfMs);
  let delta = Infinity;
  for (const c of calib.clicks) if (Math.abs(t - c) < Math.abs(delta)) delta = t - c;
  calibPad.classList.add('flash');
  setTimeout(() => calibPad.classList.remove('flash'), 90);
  if (Math.abs(delta) > CALIB_INTERVAL * 0.45) return;
  calib.deltas.push(delta);
  document.getElementById('calibProgress').textContent = `${calib.deltas.length} / ${CALIB_TAPS}`;
  if (calib.deltas.length < CALIB_TAPS) return;
  const sorted = [...calib.deltas].sort((a, b) => a - b);
  const mid = sorted.length / 2;
  calib.result = (sorted[Math.floor(mid - 0.5)] + sorted[Math.ceil(mid - 0.5)]) / 2;
  const spread = sorted[sorted.length - 2] - sorted[1];   // いちばん外れた2つを除いたばらつき
  stopCalibSounds();
  document.getElementById('calibText').textContent =
    `測れました：${calibText(calib.result)}。判定のときにこの分を差し引きます` +
    (spread > 0.15 ? '（タップのばらつきが大きめでした。やり直すと正確になるかもしれません）' : '');
  setCalibButtons('done');
}
function calibKeydown(e) {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === 'Escape') { closeCalib(); return; }
  e.preventDefault();
  calibTap(eventPerfTime(e));
}

calibPad.addEventListener('pointerdown', (e) => { e.preventDefault(); calibTap(eventPerfTime(e)); });
document.getElementById('calibBtn').addEventListener('click', openCalib);
document.getElementById('calibRetry').addEventListener('click', startCalib);
document.getElementById('calibCancel').addEventListener('click', closeCalib);
document.getElementById('calibSave').addEventListener('click', () => {
  settings.timingOffset = Math.round(calib.result * 1000) / 1000;
  saveSettings();
  closeCalib();
});

// ===== 部分ループ（区間を決めてくり返す） =====
const loopFrom = document.getElementById('loopFrom');
const loopTo = document.getElementById('loopTo');
const loopBtn = document.getElementById('loopBtn');

// 区間の選択欄とくり返しボタンを、いまの曲・設定に合わせる
function showRange(song, range) {
  for (const sel of [loopFrom, loopTo]) {
    if (sel.options.length !== song.bars) {
      sel.innerHTML = '';
      for (let i = 1; i <= song.bars; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        sel.appendChild(opt);
      }
    }
  }
  loopFrom.value = range.from;
  loopTo.value = range.to;
  loopBtn.textContent = 'くり返し：' + (settings.songLoop ? 'オン' : 'オフ');
  loopBtn.classList.toggle('on', settings.songLoop);
  loopBtn.setAttribute('aria-pressed', String(settings.songLoop));
}

// 区間を変えたら再生を止め、区間の音に合わせて鍵盤の位置を決め直す
// 始まりを終わりより後にしたら終わりを、終わりを始まりより前にしたら始まりを合わせる
function changeRange(changed) {
  stopPlayback();
  const song = currentSong();
  let from = Number(loopFrom.value);
  let to = Number(loopTo.value);
  if (from > to) { if (changed === loopFrom) to = from; else from = to; }
  if (from === 1 && to === song.bars) delete settings.songRanges[song.id];
  else settings.songRanges[song.id] = { from, to };
  saveSettings();
  songOctave = null;
  renderKeyboard();   // この中で停止中の表示も直す
  changed.blur();
}
loopFrom.addEventListener('change', () => changeRange(loopFrom));
loopTo.addEventListener('change', () => changeRange(loopTo));

loopBtn.addEventListener('click', () => {
  stopPlayback();
  settings.songLoop = !settings.songLoop;
  saveSettings();
  showSong();
});

// テンポは再生中でも変えられる（いまの位置を基準にして、そこから先の速さを変える）
tempoInput.addEventListener('input', () => {
  const song = currentSong();
  const tempo = Number(tempoInput.value);
  if (tempo === song.tempo) delete settings.songTempos[song.id];
  else settings.songTempos[song.id] = tempo;
  saveSettings();
  document.getElementById('tempoLabel').textContent = '♩=' + tempo;
  if (player.playing && ctx) {
    const now = ctx.currentTime;
    player.anchorBeat = timeToBeat(now);
    player.anchorTime = now;
    player.tempo = tempo;
  } else {
    showSong();
  }
});

// ダブルタップでの拡大を止める予備の処理（iOSではCSSだけでは止めきれないことがある。五線譜のSVGの上など）
// 短い間隔の2回目のタップはブラウザの動作を止め、ボタンの上ならボタンの操作だけ行う
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  const quick = now - lastTouchEnd < 350;
  lastTouchEnd = now;
  if (!quick || e.touches.length > 0) return;
  const t = e.target;
  if (!t.closest || t.closest('.keyboard, select, input')) return;   // 鍵盤は自前で処理、選択欄・スライダーはそのまま
  e.preventDefault();
  const target = t.closest('button, .overlay');
  if (target) target.click();
}, { passive: false });

// 音が止まっていたら、操作のたびに再開を試みる
for (const type of ['pointerup', 'touchend', 'click', 'keydown']) {
  document.addEventListener(type, () => {
    if (audioStarted && (!ctx || ctx.state !== 'running')) initAudio();
  }, true);
}

// 画面を離れたら鳴っている音を止める。戻ってきたとき音が止まっていたら再開用の画面を出す
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { setSustain(false); releaseAll(); stopPlayback(); return; }
  if (audioStarted && ctx && ctx.state !== 'running') showOverlay(true);
});

// 画面の向き・サイズが変わったら鍵盤の数を計算し直す
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(refitKeyboard, 150);
});

// 使える広さが変わったとき：鍵盤の数・段数が変わるなら作り直し、変わらなければ高さだけ合わせる
function refitKeyboard() {
  if (settings.mode === 'nameQuiz') return;   // 音名当てクイズ中は鍵盤を出していない（戻ったときに作り直す）
  const oct = calcOctaves();
  if (oct !== octaves || calcRows(oct) !== rows) renderKeyboard();
  else sizeKeyboard();
}

// ===== 設定のたたみ・開き =====
// 最初は、大きい画面（iPadなど）では開き、スマホではたたむ。切り替えたら保存する
const controlsEl = document.querySelector('.controls');
const settingsToggle = document.getElementById('settingsToggle');
function applyControlsOpen() {
  const open = settings.controlsOpen ?? Math.min(window.innerWidth, window.innerHeight) >= 600;
  controlsEl.classList.toggle('collapsed', !open);
  settingsToggle.textContent = open ? '設定を閉じる ▲' : '設定 ▼';
  settingsToggle.setAttribute('aria-expanded', String(open));
}
settingsToggle.addEventListener('click', () => {
  settings.controlsOpen = controlsEl.classList.contains('collapsed');
  saveSettings();
  applyControlsOpen();
  refitKeyboard();
});
applyControlsOpen();

applyMode();
</script>
</body>
</html>
