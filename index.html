<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ピアノ練習 - 画面鍵盤</title>
<style>
  :root {
    --bg: #1f2430;
    --panel: #2a3040;
    --text: #f2f4f8;
    --sub: #a8b0c0;
    --accent: #4fa3ff;
    --white-key: #fbfbf8;
    --white-key-active: #bfdcff;
    --black-key: #1a1a1a;
    --black-key-active: #2f6fc0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action: manipulation;
  }

  /* 操作パネル */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    padding: 10px 12px;
    background: var(--panel);
  }
  .group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .group > .label {
    font-size: 13px;
    color: var(--sub);
    white-space: nowrap;
  }
  select, button {
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: #3a4256;
    border: 1px solid #4a5370;
    border-radius: 8px;
    min-height: 40px;
    padding: 0 10px;
  }
  button { cursor: pointer; }
  button:active { background: #4a5370; }
  .octave-label {
    min-width: 76px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #sustainBtn.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  input[type="range"] { width: 110px; accent-color: var(--accent); }

  /* 音名表示エリア */
  .display {
    flex: 1;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px;
    text-align: center;
  }
  #noteName {
    font-size: clamp(32px, 10vmin, 96px);
    font-weight: 700;
    line-height: 1.1;
    min-height: 1.1em;
    transition: opacity .3s;
  }
  #noteName.idle { opacity: .35; }
  #noteSub { font-size: 15px; color: var(--sub); min-height: 1.2em; }

  /* 鍵盤 */
  .keyboard-wrap {
    padding: 0 6px 6px;
  }
  .keyboard {
    position: relative;
    display: flex;
    width: 100%;
    touch-action: none;
  }
  .key {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font-size: 13px;
  }
  .key.white {
    flex: 1 1 0;
    height: 100%;
    background: var(--white-key);
    color: #555;
    border: 1px solid #999;
    border-top: none;
    border-radius: 0 0 6px 6px;
    margin-right: -1px;
    padding-bottom: 10px;
  }
  .key.white.active {
    background: var(--white-key-active);
  }
  .key.black {
    position: absolute;
    top: 0;
    height: 62%;
    background: linear-gradient(#333, var(--black-key));
    color: #ddd;
    border-radius: 0 0 5px 5px;
    z-index: 2;
    font-size: 10px;
    padding-bottom: 6px;
    box-shadow: 0 2px 3px rgba(0,0,0,.5);
  }
  .key.black.active {
    background: var(--black-key-active);
  }
  .key .c-mark {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* 開始画面 */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 24, 32, .94);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0; font-size: 26px; }
  .start-btn {
    font-size: 22px;
    min-height: 64px;
    padding: 0 36px;
    border-radius: 32px;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .notice {
    max-width: 420px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--sub);
    background: var(--panel);
    border-radius: 10px;
    padding: 12px 16px;
    text-align: left;
  }
  .notice.hidden { display: none; }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <h1>画面鍵盤ピアノ</h1>
  <button class="start-btn" id="startBtn">タップして始める</button>
  <div class="notice hidden" id="iosNotice">
    音が出ないときは：<br>
    ・消音（マナーモード）をオフにしてください<br>
    ・本体の音量を上げてください
  </div>
</div>

<div class="controls">
  <div class="group">
    <span class="label">音色</span>
    <select id="toneSelect">
      <option value="piano">ピアノ</option>
      <option value="epiano">エレピ</option>
      <option value="organ">オルガン</option>
      <option value="synth">シンセ</option>
    </select>
  </div>
  <div class="group">
    <span class="label">音量</span>
    <input type="range" id="volume" min="0" max="100" step="1">
  </div>
  <div class="group">
    <span class="label">オクターブ</span>
    <button id="octDown" aria-label="オクターブを下げる">◀</button>
    <span class="octave-label" id="octLabel"></span>
    <button id="octUp" aria-label="オクターブを上げる">▶</button>
  </div>
  <div class="group">
    <button id="sustainBtn">サスティン：オフ</button>
  </div>
  <div class="group">
    <span class="label">音名</span>
    <select id="labelSelect">
      <option value="none">なし</option>
      <option value="doremi">ドレミ</option>
      <option value="cde">CDE</option>
    </select>
  </div>
  <div class="group">
    <span class="label">鍵盤の大きさ</span>
    <select id="sizeSelect">
      <option value="large">大</option>
      <option value="medium">中</option>
      <option value="small">小</option>
    </select>
  </div>
</div>

<div class="display">
  <div id="noteName" class="idle">♪</div>
  <div id="noteSub">鍵盤をタップしてください</div>
</div>

<div class="keyboard-wrap">
  <div class="keyboard" id="keyboard"></div>
</div>

<script>
'use strict';

// ===== 設定の保存・読み込み =====
const STORAGE_KEY = 'piano-practice:settings';
const settings = Object.assign({
  tone: 'piano',
  volume: 70,
  startOctave: null,   // null なら画面に合わせて自動
  labels: 'doremi',
  size: 'medium',
}, loadSettings());

function loadSettings() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveSettings() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) {}
}

// ===== 音名 =====
const NAMES_DOREMI = ['ド', 'ド♯', 'レ', 'レ♯', 'ミ', 'ファ', 'ファ♯', 'ソ', 'ソ♯', 'ラ', 'ラ♯', 'シ'];
const NAMES_CDE = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const BLACK = [1, 3, 6, 8, 10];
const isBlack = (midi) => BLACK.includes(midi % 12);
const octaveOf = (midi) => Math.floor(midi / 12) - 1;
const midiToFreq = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
const nameOf = (midi, style) => (style === 'cde' ? NAMES_CDE : NAMES_DOREMI)[midi % 12];

// ===== 音の再生（Web Audio API） =====
let ctx = null;
let master = null;

function initAudio() {
  if (!ctx) {
    // iOSで消音スイッチがオンでも鳴らせるよう試みる（対応環境のみ）
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    master = ctx.createGain();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12;
    comp.knee.value = 10;
    comp.ratio.value = 4;
    comp.attack.value = 0.003;
    comp.release.value = 0.2;
    master.connect(comp);
    comp.connect(ctx.destination);
    applyVolume();
  }
  if (ctx.state !== 'running') ctx.resume();
}

function applyVolume() {
  if (!master) return;
  const v = settings.volume / 100;
  master.gain.setTargetAtTime(v * v * 0.9, ctx.currentTime, 0.02);
}

function osc(type, freq, t) {
  const o = ctx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.start(t);
  return o;
}

// 音色ごとの合成。戻り値: { out: GainNode, oscs: [...], release: 秒 }
const TONES = {
  piano(freq, t) {
    const out = ctx.createGain();
    const decay = Math.min(6, Math.max(0.7, 3.2 * Math.sqrt(261.6 / freq)));
    const partials = [[1, 1], [2, 0.55], [3, 0.3], [4, 0.16], [5, 0.09], [6, 0.05]];
    const oscs = [];
    for (const [n, amp] of partials) {
      const f = freq * n * (1 + 0.0004 * n * n);
      if (f > 12000) break;
      const o = osc('sine', f, t);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(amp * 0.22, t + 0.004);
      g.gain.setTargetAtTime(0, t + 0.004, decay / Math.pow(n, 0.7));
      o.connect(g).connect(out);
      oscs.push(o);
    }
    return { out, oscs, release: 0.07, maxDur: decay * 5 };
  },
  epiano(freq, t) {
    const out = ctx.createGain();
    const decay = Math.min(4, Math.max(0.6, 2.2 * Math.sqrt(261.6 / freq)));
    const carrier = osc('sine', freq, t);
    const mod = osc('sine', freq, t);
    const modGain = ctx.createGain();
    modGain.gain.setValueAtTime(freq * 2.2, t);
    modGain.gain.setTargetAtTime(freq * 0.25, t, 0.25);
    mod.connect(modGain).connect(carrier.frequency);
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0, t);
    amp.gain.linearRampToValueAtTime(0.3, t + 0.003);
    amp.gain.setTargetAtTime(0, t + 0.003, decay);
    carrier.connect(amp).connect(out);
    return { out, oscs: [carrier, mod], release: 0.15, maxDur: decay * 5 };
  },
  organ(freq, t) {
    const out = ctx.createGain();
    const bars = [[0.5, 0.25], [1, 0.5], [2, 0.35], [3, 0.2], [4, 0.15], [6, 0.08], [8, 0.06]];
    const sum = ctx.createGain();
    sum.gain.setValueAtTime(0, t);
    sum.gain.linearRampToValueAtTime(0.16, t + 0.012);
    const oscs = [];
    for (const [n, amp] of bars) {
      if (freq * n > 12000) continue;
      const o = osc('sine', freq * n, t);
      const g = ctx.createGain();
      g.gain.value = amp;
      o.connect(g).connect(sum);
      oscs.push(o);
    }
    sum.connect(out);
    return { out, oscs, release: 0.05, maxDur: Infinity };
  },
  synth(freq, t) {
    const out = ctx.createGain();
    const o1 = osc('sawtooth', freq, t);
    const o2 = osc('sawtooth', freq, t);
    o2.detune.setValueAtTime(8, t);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.Q.value = 2;
    filter.frequency.setValueAtTime(Math.min(16000, freq * 10), t);
    filter.frequency.setTargetAtTime(Math.min(16000, freq * 3), t, 0.2);
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0, t);
    amp.gain.linearRampToValueAtTime(0.12, t + 0.01);
    amp.gain.setTargetAtTime(0.08, t + 0.01, 0.3);
    o1.connect(filter);
    o2.connect(filter);
    filter.connect(amp).connect(out);
    return { out, oscs: [o1, o2], release: 0.12, maxDur: Infinity };
  },
};

const voices = new Map();   // midi -> 鳴っている音

function startVoice(midi) {
  initAudio();
  stopVoice(midi, 0.015);
  const t = ctx.currentTime;
  const v = TONES[settings.tone](midiToFreq(midi), t);
  v.out.connect(master);
  if (isFinite(v.maxDur)) v.oscs.forEach((o) => o.stop(t + v.maxDur));
  v.oscs[0].onended = () => {
    v.out.disconnect();
    if (voices.get(midi) === v) voices.delete(midi);
  };
  voices.set(midi, v);
}

function stopVoice(midi, releaseTime) {
  const v = voices.get(midi);
  if (!v) return;
  voices.delete(midi);
  const t = ctx.currentTime;
  const r = releaseTime ?? v.release;
  const g = v.out.gain;
  if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t);
  else { g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); }
  g.setTargetAtTime(0, t, r);
  v.oscs.forEach((o) => { try { o.stop(t + r * 8); } catch (e) {} });
}

// ===== 押している鍵盤・サスティンの管理 =====
const pressCount = new Map();   // midi -> 押している指・キーの数
let sustain = false;

function noteOn(midi) {
  const n = (pressCount.get(midi) || 0) + 1;
  pressCount.set(midi, n);
  startVoice(midi);
  setKeyActive(midi, true);
  updateDisplay();
}

function noteOff(midi) {
  const n = (pressCount.get(midi) || 0) - 1;
  if (n > 0) { pressCount.set(midi, n); return; }
  pressCount.delete(midi);
  setKeyActive(midi, false);
  if (!sustain) stopVoice(midi);
  updateDisplay();
}

function setSustain(on) {
  sustain = on;
  const btn = document.getElementById('sustainBtn');
  btn.classList.toggle('on', on);
  btn.textContent = 'サスティン：' + (on ? 'オン' : 'オフ');
  if (!on) {
    for (const midi of [...voices.keys()]) {
      if (!pressCount.has(midi)) stopVoice(midi);
    }
  }
}

function releaseAll() {
  pointerNotes.clear();
  keyNotes.clear();
  pressCount.clear();
  if (ctx) for (const midi of [...voices.keys()]) stopVoice(midi);
  document.querySelectorAll('.key.active').forEach((el) => el.classList.remove('active'));
  updateDisplay();
}

// ===== 音名表示エリア =====
let lastShown = null;
function updateDisplay() {
  const nameEl = document.getElementById('noteName');
  const subEl = document.getElementById('noteSub');
  const held = [...pressCount.keys()].sort((a, b) => a - b);
  if (held.length) {
    lastShown = held;
    nameEl.classList.remove('idle');
  } else {
    nameEl.classList.add('idle');
  }
  if (!lastShown) return;
  nameEl.textContent = lastShown.map((m) => nameOf(m, 'doremi')).join(' ');
  subEl.textContent = lastShown.map((m) => NAMES_CDE[m % 12] + octaveOf(m)).join(' ');
}

// ===== 鍵盤の描画 =====
const keyboardEl = document.getElementById('keyboard');
const KEY_MIN_WIDTH = { large: 58, medium: 44, small: 32 };
let octaves = 2;
let startOctave = 4;

function calcOctaves() {
  const width = keyboardEl.clientWidth || window.innerWidth;
  const minW = KEY_MIN_WIDTH[settings.size];
  return Math.max(1, Math.min(5, Math.floor((width / minW - 1) / 7)));
}

function clampStart(o) {
  return Math.max(1, Math.min(7 - octaves, o));
}

function renderKeyboard() {
  releaseAll();
  octaves = calcOctaves();
  const defaultStart = 4 - Math.floor((octaves - 1) / 2);
  startOctave = clampStart(settings.startOctave ?? defaultStart);

  const low = 12 * (startOctave + 1);
  const high = low + 12 * octaves;
  const whiteCount = octaves * 7 + 1;
  const whiteW = 100 / whiteCount;
  const blackW = whiteW * 0.6;

  keyboardEl.innerHTML = '';
  let whiteIndex = 0;
  for (let midi = low; midi <= high; midi++) {
    const el = document.createElement('div');
    el.className = 'key ' + (isBlack(midi) ? 'black' : 'white');
    el.dataset.midi = midi;
    if (isBlack(midi)) {
      el.style.left = (whiteIndex * whiteW - blackW / 2) + '%';
      el.style.width = blackW + '%';
    } else {
      whiteIndex++;
      if (midi === 60) {
        const mark = document.createElement('span');
        mark.className = 'c-mark';
        el.appendChild(mark);
      }
    }
    const label = document.createElement('span');
    label.className = 'key-label';
    el.appendChild(label);
    keyboardEl.appendChild(el);
  }
  updateLabels();
  sizeKeyboard();
  document.getElementById('octLabel').textContent = 'C' + startOctave + '〜C' + (startOctave + octaves);
}

function updateLabels() {
  keyboardEl.querySelectorAll('.key').forEach((el) => {
    const midi = Number(el.dataset.midi);
    const label = el.querySelector('.key-label');
    if (settings.labels === 'none') { label.textContent = ''; return; }
    let text = nameOf(midi, settings.labels);
    if (midi % 12 === 0) text += octaveOf(midi);
    label.textContent = text;
  });
}

function sizeKeyboard() {
  // 白鍵の幅に合わせた高さにする（縦長の画面で鍵盤が伸びすぎないように）
  const whiteCount = octaves * 7 + 1;
  const whiteW = keyboardEl.clientWidth / whiteCount;
  const controlsH = document.querySelector('.controls').offsetHeight;
  const available = window.innerHeight - controlsH - 90;
  const h = Math.max(140, Math.min(available, whiteW * 5.2, 420));
  keyboardEl.style.height = h + 'px';
}

function setKeyActive(midi, on) {
  const el = keyboardEl.querySelector('[data-midi="' + midi + '"]');
  if (el) el.classList.toggle('active', on);
}

// ===== タッチ・マウス操作（指を滑らせると隣の鍵盤に移る） =====
const pointerNotes = new Map();   // pointerId -> midi

function midiAt(x, y) {
  const el = document.elementFromPoint(x, y);
  const key = el && el.closest('.key');
  return key && keyboardEl.contains(key) ? Number(key.dataset.midi) : null;
}

keyboardEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  keyboardEl.setPointerCapture(e.pointerId);
  const midi = midiAt(e.clientX, e.clientY);
  if (midi === null) return;
  pointerNotes.set(e.pointerId, midi);
  noteOn(midi);
});

keyboardEl.addEventListener('pointermove', (e) => {
  if (!pointerNotes.has(e.pointerId)) return;
  const midi = midiAt(e.clientX, e.clientY);
  const prev = pointerNotes.get(e.pointerId);
  if (midi === prev) return;
  if (prev !== null) noteOff(prev);
  pointerNotes.set(e.pointerId, midi);
  if (midi !== null) noteOn(midi);
});

function endPointer(e) {
  if (!pointerNotes.has(e.pointerId)) return;
  const midi = pointerNotes.get(e.pointerId);
  pointerNotes.delete(e.pointerId);
  if (midi !== null) noteOff(midi);
}
keyboardEl.addEventListener('pointerup', endPointer);
keyboardEl.addEventListener('pointercancel', endPointer);
keyboardEl.addEventListener('contextmenu', (e) => e.preventDefault());

// ===== PCキーボード操作 =====
const KEY_MAP = {
  KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7,
  KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13, KeyL: 14, KeyP: 15, Semicolon: 16,
};
const keyNotes = new Map();   // code -> midi

document.addEventListener('keydown', (e) => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); setSustain(true); return; }
  if (e.code === 'KeyZ') { shiftOctave(-1); return; }
  if (e.code === 'KeyX') { shiftOctave(1); return; }
  if (!(e.code in KEY_MAP) || keyNotes.has(e.code)) return;
  hideOverlay();
  const midi = 12 * (startOctave + 1) + KEY_MAP[e.code];
  keyNotes.set(e.code, midi);
  noteOn(midi);
});

document.addEventListener('keyup', (e) => {
  if (e.code === 'Space') { setSustain(false); return; }
  if (!keyNotes.has(e.code)) return;
  const midi = keyNotes.get(e.code);
  keyNotes.delete(e.code);
  noteOff(midi);
});

// ===== 操作パネル =====
function shiftOctave(delta) {
  const next = clampStart(startOctave + delta);
  if (next === startOctave) return;
  settings.startOctave = next;
  saveSettings();
  renderKeyboard();
}

const toneSelect = document.getElementById('toneSelect');
const volumeInput = document.getElementById('volume');
const labelSelect = document.getElementById('labelSelect');
const sizeSelect = document.getElementById('sizeSelect');

toneSelect.value = settings.tone;
volumeInput.value = settings.volume;
labelSelect.value = settings.labels;
sizeSelect.value = settings.size;

toneSelect.addEventListener('change', () => {
  settings.tone = toneSelect.value;
  saveSettings();
  toneSelect.blur();
});
volumeInput.addEventListener('input', () => {
  settings.volume = Number(volumeInput.value);
  applyVolume();
  saveSettings();
});
labelSelect.addEventListener('change', () => {
  settings.labels = labelSelect.value;
  saveSettings();
  updateLabels();
  labelSelect.blur();
});
sizeSelect.addEventListener('change', () => {
  settings.size = sizeSelect.value;
  saveSettings();
  renderKeyboard();
  sizeSelect.blur();
});
document.getElementById('octDown').addEventListener('click', () => shiftOctave(-1));
document.getElementById('octUp').addEventListener('click', () => shiftOctave(1));
document.getElementById('sustainBtn').addEventListener('click', () => setSustain(!sustain));

// ===== 開始画面 =====
const overlay = document.getElementById('overlay');
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isIOS) document.getElementById('iosNotice').classList.remove('hidden');

function hideOverlay() {
  initAudio();
  overlay.classList.add('hidden');
}
overlay.addEventListener('pointerdown', (e) => { e.preventDefault(); hideOverlay(); });

// iOSではアプリ切り替えで音が止まることがあるので、タップのたびに再開を試みる
document.addEventListener('pointerdown', () => { if (ctx && ctx.state !== 'running') ctx.resume(); }, true);

// 画面を離れたら鳴っている音を止める
document.addEventListener('visibilitychange', () => { if (document.hidden) { setSustain(false); releaseAll(); } });

// 画面の向き・サイズが変わったら鍵盤の数を計算し直す
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (calcOctaves() !== octaves) renderKeyboard();
    else sizeKeyboard();
  }, 150);
});

renderKeyboard();
</script>
</body>
</html>
