<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ピアノ練習</title>
<style>
  :root {
    --bg: #1f2430;
    --panel: #2a3040;
    --text: #f2f4f8;
    --sub: #a8b0c0;
    --accent: #4fa3ff;
    --white-key: #fbfbf8;
    --white-key-active: #bfdcff;
    --black-key: #1a1a1a;
    --black-key-active: #2f6fc0;
  }
  /* ダブルタップでの拡大を止める（iOSでは親だけでなく各部品にも指定しないと効かないことがある） */
  * { box-sizing: border-box; touch-action: manipulation; }
  html, body {
    touch-action: manipulation;
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    touch-action: manipulation;
  }

  /* 操作パネル */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    padding: 10px 12px;
    background: var(--panel);
  }
  .group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .group > .label {
    font-size: 13px;
    color: var(--sub);
    white-space: nowrap;
  }
  select, button {
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: #3a4256;
    border: 1px solid #4a5370;
    border-radius: 8px;
    min-height: 40px;
    padding: 0 10px;
  }
  button { cursor: pointer; }
  button:active { background: #4a5370; }
  .octave-label {
    min-width: 76px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  #sustainBtn.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  input[type="range"] { width: 110px; accent-color: var(--accent); }
  /* 設定をたたんだときは、よく使う項目（data-main）だけ出す */
  .controls.collapsed .group:not([data-main]) { display: none; }
  .settings-toggle { color: var(--sub); }

  /* 音名表示エリア */
  .display {
    /* 中身より小さくはしない（画面に入りきらないときは、重ならずに画面全体をスクロールできるように） */
    flex: 1 0 auto;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px;
    text-align: center;
  }
  #noteName {
    font-size: clamp(32px, 10vmin, 96px);
    font-weight: 700;
    line-height: 1.1;
    min-height: 1.1em;
    transition: opacity .3s;
  }
  #noteName.idle { opacity: .35; }
  #noteSub { font-size: 15px; color: var(--sub); min-height: 1.2em; }
  #staff {
    display: none;
    flex: 1;
    min-height: 0;
    width: 100%;
  }
  .display.staff-mode #staff { display: block; }
  .display.staff-mode #noteName { display: none; }

  /* 鍵盤 */
  .keyboard-wrap {
    padding: 0 6px 6px;
  }
  .keyboard {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }
  /* 鍵盤は指を滑らせる操作を自前で処理するので、ブラウザのタッチ操作をすべて止める */
  .keyboard, .keyboard * { touch-action: none; }
  .kb-caption {
    font-size: 12px;
    color: var(--sub);
    padding-left: 2px;
  }
  .kb-row + .kb-caption { margin-top: 8px; }
  .kb-row {
    position: relative;
    display: flex;
    width: 100%;
  }
  .key {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font-size: 13px;
  }
  .key.white {
    flex: 1 1 0;
    height: 100%;
    background: var(--white-key);
    color: #555;
    border: 1px solid #999;
    border-top: none;
    border-radius: 0 0 6px 6px;
    margin-right: -1px;
    padding-bottom: 10px;
  }
  .key.white.active {
    background: var(--white-key-active);
  }
  .key.black {
    position: absolute;
    top: 0;
    height: 62%;
    background: linear-gradient(#333, var(--black-key));
    color: #ddd;
    border-radius: 0 0 5px 5px;
    z-index: 2;
    font-size: 10px;
    padding-bottom: 6px;
    box-shadow: 0 2px 3px rgba(0,0,0,.5);
  }
  .key.black.active {
    background: var(--black-key-active);
  }
  .key .c-mark {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* 開始画面 */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 24, 32, .94);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0; font-size: 26px; }
  .start-btn {
    font-size: 22px;
    min-height: 64px;
    padding: 0 36px;
    border-radius: 32px;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .notice {
    max-width: 420px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--sub);
    background: var(--panel);
    border-radius: 10px;
    padding: 12px 16px;
    text-align: left;
  }
  .notice.hidden { display: none; }

  /* モード切り替え：data-modes に書いたモードのときだけ表示する */
  [hidden] { display: none !important; }

  /* 音名当てクイズ */
  .quiz {
    display: flex;
    flex: 1;
    min-height: 0;
    flex-direction: column;
    gap: 6px;
    padding: 8px 10px 12px;
  }
  #quizStaff {
    flex: 1;
    min-height: 0;
    width: 100%;
  }
  .quiz-feedback {
    text-align: center;
    font-size: clamp(18px, 4.5vmin, 28px);
    font-weight: 700;
    min-height: 1.3em;
  }
  .quiz-feedback.ok { color: #5fd38a; }
  .quiz-feedback.ng { color: #ff8a80; }
  .quiz-score {
    text-align: center;
    font-size: 14px;
    color: var(--sub);
    min-height: 1.2em;
    font-variant-numeric: tabular-nums;
  }
  .answers {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .answers button {
    min-height: clamp(56px, 11vh, 96px);
    padding: 0;
    font-size: clamp(18px, 5vmin, 30px);
    font-weight: 700;
  }
  .answers button.correct { background: #1e8e3e; border-color: #1e8e3e; color: #fff; }
  .answers button.wrong { background: #c5221f; border-color: #c5221f; color: #fff; }

  /* 鍵盤の位置当てクイズ */
  .keyquiz-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  #keyQuizPrompt {
    font-size: clamp(32px, 11vmin, 96px);
    font-weight: 700;
    line-height: 1.1;
  }
  .quiz-feedback.guide { color: var(--sub); font-weight: 400; font-size: 15px; }
  @media (max-height: 500px) {
    #keyQuizPrompt { font-size: 32px; }
    .keyquiz-panel .quiz-feedback { font-size: 17px; }
  }
  .key.white.correct { background: #8fe0a8; }
  .key.black.correct { background: #1e8e3e; }
  .key.white.wrong { background: #ffa69e; }
  .key.black.wrong { background: #c5221f; }

  /* 曲の練習（お手本再生＋光る鍵盤）：右手＝オレンジ、左手＝紫 */
  .song-panel {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 14px;
  }
  .song-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  #songTitle { font-size: clamp(18px, 4.5vmin, 30px); font-weight: 700; }
  #songStatus { font-size: 14px; color: var(--sub); font-variant-numeric: tabular-nums; min-height: 1.2em; }
  .song-legend { font-size: 13px; color: var(--sub); display: flex; gap: 12px; }
  .song-legend span::before {
    content: '';
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 4px;
    vertical-align: -1px;
  }
  .song-legend .lg-right::before { background: #ffb366; }
  .song-legend .lg-left::before { background: #c3a3ff; }
  #playBtn {
    font-size: 20px;
    min-height: 52px;
    min-width: 128px;
    padding: 0 22px;
    border-radius: 26px;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  #playBtn.playing { background: #c5221f; border-color: #c5221f; }
  #songHint { font-size: 13px; color: var(--sub); text-align: center; min-height: 1.2em; }
  .hand-select { display: flex; }
  .hand-select button { min-width: 56px; border-radius: 0; margin-left: -1px; }
  .hand-select button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
  .hand-select button:last-child { border-radius: 0 8px 8px 0; }
  .hand-select button.on { background: var(--accent); border-color: var(--accent); color: #fff; position: relative; }
  .loop-row { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--sub); }
  .loop-row select { min-width: 56px; }
  #loopBtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #songJudge { font-size: clamp(17px, 4vmin, 24px); font-weight: 700; min-height: 1.3em; font-variant-numeric: tabular-nums; }
  #songJudge[data-off] { display: none; }
  #songJudge.pop { animation: judge-pop .25s ease-out; }
  @keyframes judge-pop { from { transform: scale(1.25); } to { transform: scale(1); } }
  #songJudge .sub { font-size: 14px; font-weight: 400; color: var(--sub); margin-left: 6px; }
  .j-perfect { color: #ffd54f; }
  .j-great { color: #5fd38a; }
  .j-good { color: #4fa3ff; }
  .j-miss { color: #ff8a80; }
  .j-info { color: var(--sub); font-weight: 400; font-size: 14px; }
  /* 音の長さの判定（タイミングの判定の下に小さく出す） */
  #songLength { font-size: 14px; font-weight: 700; min-height: 1.3em; font-variant-numeric: tabular-nums; }
  #songLength.pop { animation: judge-pop .25s ease-out; }
  .len-just { color: #5fd38a; }
  .len-off { color: #ffb366; }
  #calibLabel { font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
  /* タイミング調整の画面 */
  #calibOverlay { z-index: 11; }
  .calib-text { max-width: 440px; font-size: 15px; line-height: 1.6; color: var(--sub); min-height: 3.2em; }
  .calib-pad, .calib-pad:active {
    width: min(70vw, 70vh, 320px);
    height: min(70vw, 40vh, 220px);
    border-radius: 24px;
    font-size: 26px;
    font-weight: 700;
    background: #3a4256;
    touch-action: none;
  }
  .calib-pad.flash { background: var(--accent); border-color: var(--accent); color: #fff; }
  .calib-progress { font-size: 16px; min-height: 1.3em; font-variant-numeric: tabular-nums; }
  .calib-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .calib-actions button[hidden] { display: none; }
  #tempoLabel { min-width: 52px; font-variant-numeric: tabular-nums; }
  .key.white.demo-left { background: #c3a3ff; }
  .key.black.demo-left { background: #7e4fe0; }
  .key.white.demo-right { background: #ffb366; }
  .key.black.demo-right { background: #e5761a; }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <h1>ピアノ練習</h1>
  <button class="start-btn" id="startBtn">タップして始める</button>
  <div class="notice hidden" id="iosNotice">
    音が出ないときは：<br>
    ・消音（マナーモード）をオフにしてください<br>
    ・本体の音量を上げてください
  </div>
</div>

<div class="overlay hidden" id="calibOverlay">
  <h1>タイミング調整</h1>
  <div class="calib-text" id="calibText"></div>
  <button class="calib-pad" id="calibPad">タップ</button>
  <div class="calib-progress" id="calibProgress"></div>
  <div class="calib-actions">
    <button id="calibSave">この値を使う</button>
    <button id="calibRetry">やり直す</button>
    <button id="calibCancel">やめる</button>
  </div>
</div>

<div class="controls">
  <div class="group" data-main>
    <span class="label">モード</span>
    <select id="modeSelect">
      <option value="piano">鍵盤ピアノ</option>
      <option value="nameQuiz">音名当てクイズ</option>
      <option value="keyQuiz">鍵盤の位置当てクイズ</option>
      <option value="song">曲の練習</option>
    </select>
  </div>
  <div class="group" data-modes="song" data-main>
    <span class="label">曲</span>
    <select id="songSelect"></select>
  </div>
  <div class="group" data-modes="song" data-practice-only>
    <span class="label">進み方</span>
    <select id="songAdvanceSelect">
      <option value="wait">弾くまで待つ</option>
      <option value="tempo">テンポ通り</option>
      <option value="judge">判定つき</option>
    </select>
  </div>
  <div class="group" data-modes="song" data-practice-only>
    <span class="label">もう片方の手</span>
    <select id="songOtherSelect">
      <option value="play">自動で鳴らす</option>
      <option value="mute">鳴らさない</option>
    </select>
  </div>
  <div class="group" data-modes="song" data-judge-only>
    <span class="label">タイミング調整</span>
    <button id="calibBtn">調整する</button>
    <span id="calibLabel"></span>
  </div>
  <div class="group" data-modes="song">
    <span class="label">テンポ</span>
    <input type="range" id="tempoInput" min="30" max="200" step="1">
    <span id="tempoLabel"></span>
  </div>
  <div class="group">
    <span class="label">音色</span>
    <select id="toneSelect">
      <option value="piano">ピアノ</option>
      <option value="epiano">エレピ</option>
      <option value="organ">オルガン</option>
      <option value="synth">シンセ</option>
    </select>
  </div>
  <div class="group">
    <span class="label">音量</span>
    <input type="range" id="volume" min="0" max="100" step="1">
  </div>
  <div class="group" data-modes="piano keyQuiz song" data-main>
    <span class="label">オクターブ</span>
    <button id="octDown" aria-label="オクターブを下げる">◀</button>
    <span class="octave-label" id="octLabel"></span>
    <button id="octUp" aria-label="オクターブを上げる">▶</button>
  </div>
  <div class="group" data-modes="piano" data-main>
    <button id="sustainBtn">サスティン：オフ</button>
  </div>
  <div class="group" data-modes="piano">
    <span class="label">表示</span>
    <select id="displaySelect">
      <option value="names">音名</option>
      <option value="grand">大譜表</option>
      <option value="treble">ト音記号</option>
      <option value="bass">ヘ音記号</option>
    </select>
  </div>
  <div class="group" data-modes="piano song">
    <span class="label">鍵盤の音名</span>
    <select id="labelSelect">
      <option value="none">なし</option>
      <option value="doremi">ドレミ</option>
      <option value="cde">CDE</option>
    </select>
  </div>
  <div class="group" data-modes="piano keyQuiz song">
    <span class="label">鍵盤の大きさ</span>
    <select id="sizeSelect">
      <option value="large">大</option>
      <option value="medium">中</option>
      <option value="small">小</option>
    </select>
  </div>
  <div class="group" data-modes="piano keyQuiz song">
    <span class="label">段数</span>
    <select id="rowsSelect">
      <option value="auto">自動</option>
      <option value="1">1段</option>
      <option value="2">2段</option>
    </select>
  </div>
  <div class="group" data-modes="nameQuiz">
    <span class="label">音部記号</span>
    <select id="quizClefSelect">
      <option value="treble">ト音記号</option>
      <option value="bass">ヘ音記号</option>
      <option value="both">両方</option>
    </select>
  </div>
  <div class="group" data-modes="nameQuiz">
    <span class="label">出題範囲</span>
    <select id="quizRangeSelect">
      <option value="staff">加線なし</option>
      <option value="ledger1">加線1本まで</option>
      <option value="ledger2">加線2本まで</option>
    </select>
  </div>
  <div class="group" data-modes="keyQuiz">
    <span class="label">出題する音</span>
    <select id="keyQuizKeysSelect">
      <option value="white">白鍵だけ</option>
      <option value="all">黒鍵も</option>
    </select>
  </div>
  <div class="group" data-modes="keyQuiz">
    <span class="label">音の高さ</span>
    <select id="keyQuizOctaveSelect">
      <option value="any">どのオクターブでも正解</option>
      <option value="exact">オクターブも当てる</option>
    </select>
  </div>
  <div class="group" data-modes="nameQuiz keyQuiz">
    <span class="label">答えの表記</span>
    <select id="quizNamesSelect">
      <option value="doremi">ドレミ</option>
      <option value="cde">CDE</option>
    </select>
  </div>
  <div class="group" data-modes="nameQuiz keyQuiz">
    <button id="quizResetBtn">成績リセット</button>
  </div>
  <button id="settingsToggle" class="settings-toggle" aria-expanded="true"></button>
</div>

<div class="display" id="display" data-modes="piano keyQuiz song">
  <div id="noteName" class="idle" data-modes="piano">♪</div>
  <svg id="staff" preserveAspectRatio="xMidYMid meet" aria-label="五線譜" data-modes="piano"></svg>
  <div id="noteSub" data-modes="piano">鍵盤をタップしてください</div>
  <div class="keyquiz-panel" data-modes="keyQuiz">
    <div id="keyQuizPrompt"></div>
    <div class="quiz-feedback" id="keyQuizFeedback"></div>
    <div class="quiz-score" id="keyQuizScore"></div>
  </div>
  <div class="song-panel" data-modes="song">
    <div class="song-info">
      <div id="songTitle"></div>
      <div id="songStatus"></div>
      <div id="songJudge"></div>
      <div id="songLength" hidden></div>
      <div class="song-legend"><span class="lg-right">右手</span><span class="lg-left">左手</span></div>
    </div>
    <div class="hand-select" id="handSelect" role="group" aria-label="練習する手">
      <button data-hand="both">両手</button>
      <button data-hand="right">右手</button>
      <button data-hand="left">左手</button>
    </div>
    <div class="loop-row" role="group" aria-label="練習する区間">
      <select id="loopFrom" aria-label="区間の始まりの小節"></select>
      <span>〜</span>
      <select id="loopTo" aria-label="区間の終わりの小節"></select>
      <span>小節</span>
      <button id="loopBtn" aria-pressed="false">くり返し：オフ</button>
    </div>
    <button id="playBtn">▶ 再生</button>
  </div>
  <div id="songHint" data-modes="song"></div>
</div>

<div class="keyboard-wrap" data-modes="piano keyQuiz song">
  <div class="keyboard" id="keyboard"></div>
</div>

<div class="quiz" id="quiz" data-modes="nameQuiz">
  <svg id="quizStaff" preserveAspectRatio="xMidYMid meet" aria-label="出題の五線譜"></svg>
  <div class="quiz-feedback" id="quizFeedback"></div>
  <div class="quiz-score" id="quizScore"></div>
  <div class="answers" id="answers"></div>
</div>

<script>
'use strict';

// ===== 設定の保存・読み込み =====
const STORAGE_KEY = 'piano-practice:settings';
const settings = Object.assign({
  tone: 'piano',
  volume: 70,
  startOctave: null,   // null なら画面に合わせて自動
  labels: 'doremi',
  size: 'medium',
  rows: 'auto',        // auto: 縦向きで余裕があれば2段
  display: 'names',    // names / grand（大譜表）/ treble / bass
  mode: 'piano',       // piano（鍵盤ピアノ）/ nameQuiz（音名当てクイズ）/ keyQuiz（鍵盤の位置当てクイズ）
  quizClef: 'treble',  // treble / bass / both
  quizRange: 'staff',  // staff（加線なし）/ ledger1 / ledger2
  quizNames: 'doremi', // クイズの音名の表記：doremi / cde
  keyQuizKeys: 'white',  // 位置当てで出題する音：white（白鍵だけ）/ all（黒鍵も）
  keyQuizOctave: 'any',  // any（どのオクターブでも正解）/ exact（オクターブも当てる）
  songId: null,          // 曲の練習で選んでいる曲
  songTempos: {},        // 曲ごとに変えたテンポ（曲のid → ♩の数）
  songHand: 'both',      // 練習する手：both（両手＝お手本を聴く）/ right / left
  songAdvance: 'wait',   // 片手練習の進み方：wait（弾くまで待つ）/ tempo（テンポ通り）/ judge（判定つき）
  songOther: 'play',     // 片手練習のもう片方の手：play（自動で鳴らす）/ mute（鳴らさない）
  songRanges: {},        // 曲ごとの練習する区間（曲のid → { from, to }：小節の番号。全体なら記録しない）
  songLoop: false,       // 区間をくり返すか
  timingOffset: 0,       // タイミング調整：この端末で、押してから判定に届くまでの遅れ（秒）。判定のときに差し引く
  controlsOpen: null,    // 設定を開いているか（null なら画面の大きさで決める）
}, loadJSON(STORAGE_KEY));

function loadJSON(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; }
  catch (e) { return {}; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}
function saveSettings() { saveJSON(STORAGE_KEY, settings); }

// ===== 音名 =====
const NAMES_DOREMI = ['ド', 'ド♯', 'レ', 'レ♯', 'ミ', 'ファ', 'ファ♯', 'ソ', 'ソ♯', 'ラ', 'ラ♯', 'シ'];
const NAMES_CDE = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const BLACK = [1, 3, 6, 8, 10];
const isBlack = (midi) => BLACK.includes(midi % 12);
const octaveOf = (midi) => Math.floor(midi / 12) - 1;
const midiToFreq = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
const nameOf = (midi, style) => (style === 'cde' ? NAMES_CDE : NAMES_DOREMI)[midi % 12];

// ===== 音の再生（Web Audio API） =====
let ctx = null;
let master = null;          // 各音をまとめる入口
let volumeNode = null;      // 音量スライダーの値をかける場所
let audioStarted = false;   // 開始画面をタップしたか
let audioStale = false;     // 再開できなかったので作り直しが必要か

function createAudio() {
  // iOSで消音スイッチがオンでも鳴らせるよう試みる（対応環境のみ）
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  const c = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  ({ input: master, volume: volumeNode } = buildOutput(c));
  c.onstatechange = () => { if (c === ctx) watchAudioState(); };
  ctx = c;
  audioStale = false;
  applyVolume();
}

// 出力の流れ：各音 → コンプレッサー（和音で大きくなりすぎないように）→ 音量 → ソフトクリップ（音割れ防止）→ スピーカー
// 音量をコンプレッサーの後ろでかけるので、スライダーを上げた分だけそのまま大きくなる
function buildOutput(c) {
  const input = c.createGain();
  const comp = c.createDynamicsCompressor();
  comp.threshold.value = -20;
  comp.knee.value = 10;
  comp.ratio.value = 8;
  comp.attack.value = 0.002;
  comp.release.value = 0.25;
  const volume = c.createGain();
  // 0.8を超えたところから、なめらかに1.0へ近づける（急に音が割れないように）
  const pre = c.createGain();
  pre.gain.value = 0.5;
  const shaper = c.createWaveShaper();
  const n = 4096;
  const curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1) * 2 - 1) * 2;
    const a = Math.abs(x);
    curve[i] = a < 0.8 ? x : Math.sign(x) * (0.8 + 0.2 * Math.tanh((a - 0.8) / 0.2));
  }
  shaper.curve = curve;
  shaper.oversample = '2x';
  input.connect(comp).connect(volume).connect(pre).connect(shaper).connect(c.destination);
  return { input, volume };
}

function resetAudio() {
  if (player.playing) stopPlayback();
  const old = ctx;
  ctx = null;
  master = null;
  volumeNode = null;
  voices.clear();
  try { old.close(); } catch (e) {}
}

// タップなどの操作の中で呼ぶ。止まっていたら再開し、再開できない状態なら作り直す
function initAudio() {
  // iOSではアプリ切り替えなどで「中断（interrupted）」になり、resume() では戻らないことがある
  if (ctx && (audioStale || ctx.state === 'closed' || ctx.state === 'interrupted')) resetAudio();
  if (!ctx) createAudio();
  if (ctx.state === 'running') return;
  ctx.resume().catch(() => {});
  playSilence();
  const c = ctx;
  setTimeout(() => {
    if (c === ctx && c.state !== 'running') {
      audioStale = true;
      showOverlay(true);
    }
  }, 600);
}

// iOSで音の出力を確実に始めるため、無音を一瞬再生する
function playSilence() {
  const src = ctx.createBufferSource();
  src.buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
  src.connect(ctx.destination);
  src.start();
}

// 使っている途中で音が止まったら、再開用の画面を出す
function watchAudioState() {
  if (!audioStarted || document.hidden || ctx.state === 'running') return;
  const c = ctx;
  setTimeout(() => {
    if (c === ctx && c.state !== 'running' && !document.hidden) showOverlay(true);
  }, 400);
}

function applyVolume() {
  if (!volumeNode) return;
  const v = settings.volume / 100;
  volumeNode.gain.setTargetAtTime(1.6 * Math.pow(v, 1.5), ctx.currentTime, 0.02);
}

function osc(type, freq, t) {
  const o = ctx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  o.start(t);
  return o;
}

// 低い音の聞こえにくさを補う
// iPad・スマホのスピーカーは低い周波数がほとんど出ないので、低い音ほど小さく聞こえる。
// ド4より下は、低くなるほど音量を上げる（ド3で約1.4倍、ド2で約1.9倍、上限2倍）
function lowBoost(freq) {
  return Math.min(2, Math.pow(Math.max(1, 261.6 / freq), 0.45));
}
// ド4より下で、どれだけ低いか（0：ド4以上 〜 1：ド2以下）
function lowness(freq) {
  return Math.min(1, Math.max(0, Math.log2(261.6 / freq) / 2));
}

// 音色ごとの合成。戻り値: { out: GainNode, oscs: [...], release: 秒 }
const PIANO_PARTIALS = [1, 0.55, 0.3, 0.16, 0.09, 0.05, 0, 0];
// 低い音用：倍音を多めにする（スピーカーで出やすい高さの倍音で音の高さが聞き取れるように。本物のピアノの低音も倍音が多い）
const PIANO_PARTIALS_LOW = [1, 0.8, 0.6, 0.45, 0.32, 0.22, 0.14, 0.09];
const TONES = {
  piano(freq, t) {
    const out = ctx.createGain();
    const decay = Math.min(6, Math.max(0.7, 3.2 * Math.sqrt(261.6 / freq)));
    const low = lowness(freq);
    const boost = lowBoost(freq);
    const oscs = [];
    for (let i = 0; i < PIANO_PARTIALS.length; i++) {
      const n = i + 1;
      const amp = PIANO_PARTIALS[i] + (PIANO_PARTIALS_LOW[i] - PIANO_PARTIALS[i]) * low;
      if (amp <= 0) continue;
      const f = freq * n * (1 + 0.0004 * n * n);
      if (f > 12000) break;
      const o = osc('sine', f, t);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(amp * 0.22 * boost, t + 0.004);
      g.gain.setTargetAtTime(0, t + 0.004, decay / Math.pow(n, 0.7));
      o.connect(g).connect(out);
      oscs.push(o);
    }
    return { out, oscs, release: 0.07, maxDur: decay * 5 };
  },
  epiano(freq, t) {
    const out = ctx.createGain();
    const decay = Math.min(4, Math.max(0.6, 2.2 * Math.sqrt(261.6 / freq)));
    const carrier = osc('sine', freq, t);
    const mod = osc('sine', freq, t);
    const modGain = ctx.createGain();
    // 低い音は変調を強めに残して倍音を増やす（スピーカーで聞き取りやすいように）
    const low = lowness(freq);
    modGain.gain.setValueAtTime(freq * (2.2 + 1.5 * low), t);
    modGain.gain.setTargetAtTime(freq * (0.25 + 1.6 * low), t, 0.25);
    mod.connect(modGain).connect(carrier.frequency);
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0, t);
    amp.gain.linearRampToValueAtTime(0.3 * lowBoost(freq), t + 0.003);
    amp.gain.setTargetAtTime(0, t + 0.003, decay);
    carrier.connect(amp).connect(out);
    return { out, oscs: [carrier, mod], release: 0.15, maxDur: decay * 5 };
  },
  organ(freq, t) {
    const out = ctx.createGain();
    const bars = [[0.5, 0.25], [1, 0.5], [2, 0.35], [3, 0.2], [4, 0.15], [6, 0.08], [8, 0.06]];
    const sum = ctx.createGain();
    sum.gain.setValueAtTime(0, t);
    sum.gain.linearRampToValueAtTime(0.3 * lowBoost(freq), t + 0.012);
    const oscs = [];
    const low = lowness(freq);
    for (const [n, amp] of bars) {
      if (freq * n > 12000) continue;
      const o = osc('sine', freq * n, t);
      const g = ctx.createGain();
      // 1オクターブ下の音は、低い音ではスピーカーからほぼ出ず音割れの元になるので弱める。
      // 2倍音より上は、低い音ほど強める（スピーカーで聞き取りやすいように）
      g.gain.value = n < 1 ? amp * (1 - low) : n >= 2 ? amp * (1 + 0.7 * low) : amp;
      o.connect(g).connect(sum);
      oscs.push(o);
    }
    sum.connect(out);
    return { out, oscs, release: 0.05, maxDur: Infinity };
  },
  synth(freq, t) {
    const out = ctx.createGain();
    const o1 = osc('sawtooth', freq, t);
    const o2 = osc('sawtooth', freq, t);
    o2.detune.setValueAtTime(8, t);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.Q.value = 2;
    filter.frequency.setValueAtTime(Math.min(16000, freq * 10), t);
    // 低い音でもこもりすぎないよう、フィルターは600Hzより下げない
    filter.frequency.setTargetAtTime(Math.min(16000, Math.max(600, freq * 3)), t, 0.2);
    const boost = lowBoost(freq);
    const amp = ctx.createGain();
    amp.gain.setValueAtTime(0, t);
    amp.gain.linearRampToValueAtTime(0.22 * boost, t + 0.01);
    amp.gain.setTargetAtTime(0.145 * boost, t + 0.01, 0.3);
    o1.connect(filter);
    o2.connect(filter);
    filter.connect(amp).connect(out);
    return { out, oscs: [o1, o2], release: 0.12, maxDur: Infinity };
  },
};

const voices = new Map();   // midi -> 鳴っている音

function startVoice(midi) {
  initAudio();
  stopVoice(midi, 0.015);
  const t = ctx.currentTime;
  const v = TONES[settings.tone](midiToFreq(midi), t);
  v.out.connect(master);
  if (isFinite(v.maxDur)) v.oscs.forEach((o) => o.stop(t + v.maxDur));
  v.oscs[0].onended = () => {
    v.out.disconnect();
    if (voices.get(midi) === v) voices.delete(midi);
  };
  voices.set(midi, v);
}

function stopVoice(midi, releaseTime) {
  const v = voices.get(midi);
  if (!v) return;
  voices.delete(midi);
  const t = ctx.currentTime;
  const r = releaseTime ?? v.release;
  const g = v.out.gain;
  if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t);
  else { g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); }
  g.setTargetAtTime(0, t, r);
  v.oscs.forEach((o) => { try { o.stop(t + r * 8); } catch (e) {} });
}

// ===== 押している鍵盤・サスティンの管理 =====
const pressCount = new Map();   // midi -> 押している指・キーの数
let sustain = false;

function noteOn(midi) {
  const n = (pressCount.get(midi) || 0) + 1;
  pressCount.set(midi, n);
  startVoice(midi);
  setKeyActive(midi, true);
  updateDisplay();
  if (settings.mode === 'song') songNoteOn(midi);
}

// perfMs：離した瞬間の時刻（イベントの timeStamp）。音の長さの判定に使う
function noteOff(midi, perfMs) {
  const n = (pressCount.get(midi) || 0) - 1;
  if (n > 0) { pressCount.set(midi, n); return; }
  pressCount.delete(midi);
  if (settings.mode === 'song') songLengthRelease(midi, perfMs ?? performance.now());
  setKeyActive(midi, false);
  if (!sustain) stopVoice(midi);
  updateDisplay();
}

function setSustain(on) {
  sustain = on;
  const btn = document.getElementById('sustainBtn');
  btn.classList.toggle('on', on);
  btn.textContent = 'サスティン：' + (on ? 'オン' : 'オフ');
  if (!on) {
    for (const midi of [...voices.keys()]) {
      if (!pressCount.has(midi)) stopVoice(midi);
    }
  }
}

function releaseAll() {
  pointerNotes.clear();
  keyNotes.clear();
  pressCount.clear();
  if (ctx) for (const midi of [...voices.keys()]) stopVoice(midi);
  document.querySelectorAll('.key.active').forEach((el) => el.classList.remove('active'));
  updateDisplay();
}

// ===== 表示エリア（音名・五線譜） =====
let lastShown = null;
function updateDisplay() {
  if (settings.mode !== 'piano') return;
  const displayEl = document.getElementById('display');
  const nameEl = document.getElementById('noteName');
  const subEl = document.getElementById('noteSub');
  const staffMode = settings.display !== 'names';
  displayEl.classList.toggle('staff-mode', staffMode);
  const held = [...pressCount.keys()].sort((a, b) => a - b);
  const idle = held.length === 0;
  if (!idle) lastShown = held;
  nameEl.classList.toggle('idle', idle);
  if (staffMode) renderStaff(document.getElementById('staff'), lastShown || [], settings.display, { dim: idle });
  if (!lastShown) return;
  nameEl.textContent = lastShown.map((m) => nameOf(m, 'doremi')).join(' ');
  const cde = lastShown.map((m) => NAMES_CDE[m % 12] + octaveOf(m)).join(' ');
  subEl.textContent = staffMode ? nameEl.textContent + '（' + cde + '）' : cde;
}

// ===== 五線譜の描画（SVG） =====
// 単位：S = 線と線の間隔。記号は外部フォントを使わずパスで描く（端末によって形が変わらないように）
const S = 10;
const STEP_OF_PC = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6];   // ♯で表記
const diatonic = (m) => octaveOf(m) * 7 + STEP_OF_PC[m % 12];
const CLEFS = {
  treble: { bottomDi: 30 },   // 第1線＝ミ（E4）
  bass: { bottomDi: 18 },     // 第1線＝ソ（G2）
};
const STAFF_W = 18 * S;
const NOTE_X = 10.5 * S;
const INK = '#222';
const PAPER = '#fbfaf5';
// ト音記号・ヘ音記号（第5線をy=0、第4線をy=1…とする、線間隔1の座標）
const TREBLE_PATH = 'M0.3 3.55C-0.45 3.6-0.6 2.55 0.1 2.4C0.95 2.2 1.35 3.25 0.85 3.85C0.3 4.5-0.95 4.35-1.1 3.35C-1.25 2.3-0.15 1.65 0.45 0.75C0.95 0-0.6 -1.6 0.35 -1.6C0.85 -1.6 0.75 -0.55-0.05 0.35L0.4 5.15C0.5 5.85-0.15 6.1-0.5 5.8';
const BASS_PATH = 'M-0.55 1C-0.6 0.1 1.25 -0.3 1.25 1.15C1.25 2.4 0.2 3.4-0.9 3.95';

// mode: grand（大譜表）/ treble / bass
// opts.dim: 音符を薄く表示する / opts.color: 音符の色 / opts.minY・maxY: 表示範囲の最小値（音符によって広げる）
function renderStaff(svg, midis, mode, opts = {}) {
  const staves = mode === 'grand'
    ? [{ clef: 'treble', top: 0 }, { clef: 'bass', top: 10 * S }]
    : [{ clef: mode, top: 0 }];
  const noteInk = opts.color || INK;
  let minY = Math.min(-3.5 * S, opts.minY ?? 0);
  let maxY = Math.max(staves[staves.length - 1].top + 7.5 * S, opts.maxY ?? 0);
  let body = '';

  for (const st of staves) {
    const bottomDi = CLEFS[st.clef].bottomDi;
    const yOf = (di) => st.top + 4 * S - (di - bottomDi) * S / 2;
    // 五線と音部記号
    for (let i = 0; i < 5; i++) {
      body += `<line x1="${0.5 * S}" x2="${STAFF_W - 0.5 * S}" y1="${st.top + i * S}" y2="${st.top + i * S}" stroke="${INK}" stroke-width="1"/>`;
    }
    const tr = `translate(${2.6 * S} ${st.top}) scale(${S})`;
    if (st.clef === 'treble') {
      body += `<g transform="${tr}"><path d="${TREBLE_PATH}" fill="none" stroke="${INK}" stroke-width="0.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-0.45" cy="5.6" r="0.28" fill="${INK}"/></g>`;
    } else {
      body += `<g transform="${tr}"><circle cx="-0.5" cy="1" r="0.34" fill="${INK}"/><path d="${BASS_PATH}" fill="none" stroke="${INK}" stroke-width="0.24" stroke-linecap="round"/><circle cx="1.75" cy="0.5" r="0.15" fill="${INK}"/><circle cx="1.75" cy="1.5" r="0.15" fill="${INK}"/></g>`;
    }

    // この段に書く音（大譜表はド4以上をト音記号、それより下をヘ音記号に）
    const notes = midis
      .filter((m) => mode !== 'grand' || (st.clef === 'treble' ? m >= 60 : m < 60))
      .map((m) => ({ m, di: diatonic(m), sharp: isBlack(m) }))
      .sort((a, b) => a.di - b.di || a.m - b.m);
    let notesSvg = '';
    const cols = [];
    for (const n of notes) {
      // 2度以内でぶつかる音は右の列にずらす
      let col = 0;
      while (cols.some((c) => c.col === col && n.di - c.di <= 1)) col++;
      cols.push({ col, di: n.di });
      n.x = NOTE_X + col * 1.5 * S;
      n.y = yOf(n.di);
      // 加線
      const lineDis = [];
      for (let d = bottomDi - 2; d >= n.di; d -= 2) lineDis.push(d);
      for (let d = bottomDi + 10; d <= n.di; d += 2) lineDis.push(d);
      for (const d of lineDis) {
        notesSvg += `<line x1="${n.x - 1.2 * S}" x2="${n.x + 1.2 * S}" y1="${yOf(d)}" y2="${yOf(d)}" stroke="${noteInk}" stroke-width="1"/>`;
      }
      // 全音符
      notesSvg += `<ellipse cx="${n.x}" cy="${n.y}" rx="${0.78 * S}" ry="${0.52 * S}" fill="${noteInk}"/>`;
      notesSvg += `<ellipse cx="${n.x}" cy="${n.y}" rx="${0.4 * S}" ry="${0.24 * S}" fill="${PAPER}" transform="rotate(55 ${n.x} ${n.y})"/>`;
      minY = Math.min(minY, n.y - 2 * S);
      maxY = Math.max(maxY, n.y + 2 * S);
    }
    // ♯（近い音どうしは列をずらす）
    const placed = [];
    for (const n of notes.filter((n) => n.sharp).reverse()) {
      let col = 0;
      while (placed.some((p) => p.col === col && Math.abs(p.di - n.di) < 6)) col++;
      placed.push({ col, di: n.di });
      notesSvg += sharpSvg(NOTE_X - 2 * S - col * 1.3 * S, n.y);
    }
    body += `<g opacity="${opts.dim ? 0.35 : 1}">${notesSvg}</g>`;
  }

  const pad = 0.5 * S;
  svg.setAttribute('viewBox', `0 ${minY - pad} ${STAFF_W} ${maxY - minY + 2 * pad}`);
  svg.innerHTML = `<rect x="0" y="${minY - pad}" width="${STAFF_W}" height="${maxY - minY + 2 * pad}" rx="${S}" fill="${PAPER}"/>` + body;
}

function sharpSvg(cx, cy) {
  const v = 0.3 * S, h = 0.62 * S;
  return `<g stroke="${INK}" stroke-linecap="butt">` +
    `<line x1="${cx - v}" x2="${cx - v}" y1="${cy - 1.3 * S}" y2="${cy + 1.4 * S}" stroke-width="${0.13 * S}"/>` +
    `<line x1="${cx + v}" x2="${cx + v}" y1="${cy - 1.4 * S}" y2="${cy + 1.3 * S}" stroke-width="${0.13 * S}"/>` +
    `<line x1="${cx - h}" x2="${cx + h}" y1="${cy - 0.3 * S}" y2="${cy - 0.55 * S}" stroke-width="${0.28 * S}"/>` +
    `<line x1="${cx - h}" x2="${cx + h}" y1="${cy + 0.55 * S}" y2="${cy + 0.3 * S}" stroke-width="${0.28 * S}"/>` +
    `</g>`;
}

// ===== 鍵盤の描画 =====
// 2段のときは、下段＝基準の音域（右手）、上段＝そのすぐ下の音域（左手）
const keyboardEl = document.getElementById('keyboard');
const KEY_MIN_WIDTH = { large: 58, medium: 44, small: 32 };
const KEY_RATIO = 6;          // 白鍵の高さ÷幅の上限（実物のピアノに近い比率）
const KEY_MAX_HEIGHT = 420;
const DISPLAY_MIN = 90;       // 音名表示エリアに最低限残す高さ
let octaves = 2;
let rows = 1;
let startOctave = 4;

// 表示エリアに残す高さ。クイズや曲の表示は、中身に必要な高さを測って空ける
function displayMin() {
  const ids = settings.mode === 'keyQuiz' ? ['.keyquiz-panel']
    : settings.mode === 'song' ? ['.song-panel', '#songHint'] : [];
  let h = 0;
  for (const sel of ids) h += document.querySelector(sel).offsetHeight + 4;
  return Math.max(DISPLAY_MIN, h + 16);   // 16：表示エリアの上下の余白
}
let songOctave = null;   // 曲の練習で、オクターブボタンで動かした鍵盤の位置（null なら曲に合わせて自動）

function calcOctaves() {
  const width = keyboardEl.clientWidth || window.innerWidth;
  const minW = KEY_MIN_WIDTH[settings.size];
  return Math.max(1, Math.min(5, Math.floor((width / minW - 1) / 7)));
}

function calcRows(oct) {
  if (settings.rows !== 'auto') return Number(settings.rows);
  // 縦向きで、2段にしても鍵盤が十分な高さを保てるときだけ2段にする
  const whiteW = (keyboardEl.clientWidth || window.innerWidth) / (oct * 7 + 1);
  const available = window.innerHeight - document.querySelector('.controls').offsetHeight - displayMin();
  const portrait = window.innerHeight > window.innerWidth * 1.1;
  return portrait && available / 2 - 30 >= Math.min(whiteW * 4.5, 220) ? 2 : 1;
}

function clampStart(o) {
  const min = rows === 2 ? 1 + octaves : 1;
  return Math.max(min, Math.min(7 - octaves, o));
}

function rangeLabel(low) {
  return 'C' + low + '〜C' + (low + octaves);
}

function renderKeyboard() {
  releaseAll();
  octaves = calcOctaves();
  rows = calcRows(octaves);
  const defaultStart = 4 - Math.floor((octaves - 1) / 2);
  // 曲の練習では、曲の音がなるべく多く鍵盤に入る位置に合わせる（オクターブを動かしても保存しない）
  startOctave = settings.mode === 'song'
    ? clampStart(songOctave ?? fitOctaveForSong())
    : clampStart(settings.startOctave ?? defaultStart);
  lit.clear();   // 鍵盤を作り直したので、光らせている状態を忘れる

  keyboardEl.innerHTML = '';
  if (rows === 2) {
    addRow(startOctave - octaves, '上段（左手）：' + rangeLabel(startOctave - octaves));
    addRow(startOctave, '下段（右手）：' + rangeLabel(startOctave));
  } else {
    addRow(startOctave, null);
  }
  updateLabels();
  if (settings.mode === 'keyQuiz') nextKeyQuestion();   // 鍵盤の範囲が変わったので出題し直す
  if (settings.mode === 'song' && !player.playing) showSong();   // 鍵盤に入りきらない音があるかを表示し直す
  sizeKeyboard();   // 表示エリアの中身が決まってから、鍵盤の高さを決める
  document.getElementById('octLabel').textContent =
    rows === 2 ? 'C' + (startOctave - octaves) + '〜C' + (startOctave + octaves) : rangeLabel(startOctave);
}

function addRow(lowOctave, caption) {
  if (caption) {
    const cap = document.createElement('div');
    cap.className = 'kb-caption';
    cap.textContent = caption;
    keyboardEl.appendChild(cap);
  }
  const row = document.createElement('div');
  row.className = 'kb-row';
  const low = 12 * (lowOctave + 1);
  const high = low + 12 * octaves;
  const whiteW = 100 / (octaves * 7 + 1);
  const blackW = whiteW * 0.6;
  let whiteIndex = 0;
  for (let midi = low; midi <= high; midi++) {
    const el = document.createElement('div');
    el.className = 'key ' + (isBlack(midi) ? 'black' : 'white');
    el.dataset.midi = midi;
    if (isBlack(midi)) {
      el.style.left = (whiteIndex * whiteW - blackW / 2) + '%';
      el.style.width = blackW + '%';
    } else {
      whiteIndex++;
      if (midi === 60) {
        const mark = document.createElement('span');
        mark.className = 'c-mark';
        el.appendChild(mark);
      }
    }
    const label = document.createElement('span');
    label.className = 'key-label';
    el.appendChild(label);
    row.appendChild(el);
  }
  keyboardEl.appendChild(row);
}

function updateLabels() {
  keyboardEl.querySelectorAll('.key').forEach((el) => {
    const midi = Number(el.dataset.midi);
    const label = el.querySelector('.key-label');
    // 位置当てクイズ中は答えが分かってしまうので音名を出さない
    if (settings.labels === 'none' || settings.mode === 'keyQuiz') { label.textContent = ''; return; }
    let text = nameOf(midi, settings.labels);
    if (midi % 12 === 0) text += octaveOf(midi);
    label.textContent = text;
  });
}

function sizeKeyboard() {
  // 白鍵の幅に合わせた高さにする（縦長の画面で鍵盤が伸びすぎないように）
  const whiteW = keyboardEl.clientWidth / (octaves * 7 + 1);
  const controlsH = document.querySelector('.controls').offsetHeight;
  const extra = rows === 2 ? 50 : 0;   // 段の見出しと間隔
  const available = (window.innerHeight - controlsH - displayMin() - extra) / rows;
  const h = Math.max(100, Math.min(available, whiteW * KEY_RATIO, KEY_MAX_HEIGHT));
  keyboardEl.querySelectorAll('.kb-row').forEach((row) => { row.style.height = h + 'px'; });
}

function setKeyActive(midi, on) {
  // 2段のときは同じ音の鍵盤が両方の段にあることがある
  keyboardEl.querySelectorAll('[data-midi="' + midi + '"]').forEach((el) => el.classList.toggle('active', on));
}

// ===== タッチ・マウス操作（指を滑らせると隣の鍵盤に移る） =====
const pointerNotes = new Map();   // pointerId -> midi

function midiAt(x, y) {
  const el = document.elementFromPoint(x, y);
  const key = el && el.closest('.key');
  return key && keyboardEl.contains(key) ? Number(key.dataset.midi) : null;
}

keyboardEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  keyboardEl.setPointerCapture(e.pointerId);
  const midi = midiAt(e.clientX, e.clientY);
  if (midi === null) return;
  pointerNotes.set(e.pointerId, midi);
  noteOn(midi);
  if (settings.mode === 'keyQuiz') answerKeyQuiz(midi);
  if (settings.mode === 'song') songJudgePress(midi, eventPerfTime(e));
});

keyboardEl.addEventListener('pointermove', (e) => {
  if (!pointerNotes.has(e.pointerId)) return;
  const midi = midiAt(e.clientX, e.clientY);
  const prev = pointerNotes.get(e.pointerId);
  if (midi === prev) return;
  if (prev !== null) noteOff(prev, eventPerfTime(e));
  pointerNotes.set(e.pointerId, midi);
  if (midi !== null) noteOn(midi);
});

function endPointer(e) {
  if (!pointerNotes.has(e.pointerId)) return;
  const midi = pointerNotes.get(e.pointerId);
  pointerNotes.delete(e.pointerId);
  if (midi !== null) noteOff(midi, eventPerfTime(e));
}
keyboardEl.addEventListener('pointerup', endPointer);
keyboardEl.addEventListener('pointercancel', endPointer);
keyboardEl.addEventListener('contextmenu', (e) => e.preventDefault());

// ===== PCキーボード操作 =====
const KEY_MAP = {
  KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7,
  KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13, KeyL: 14, KeyP: 15, Semicolon: 16,
};
const keyNotes = new Map();   // code -> midi

document.addEventListener('keydown', (e) => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (calib.open) { calibKeydown(e); return; }
  if (settings.mode === 'nameQuiz') { quizKeydown(e); return; }
  if (e.code === 'Space') { e.preventDefault(); if (settings.mode === 'piano') setSustain(true); return; }
  if (e.code === 'KeyZ') { shiftOctave(-1); return; }
  if (e.code === 'KeyX') { shiftOctave(1); return; }
  if (!(e.code in KEY_MAP) || keyNotes.has(e.code)) return;
  hideOverlay();
  const midi = 12 * (startOctave + 1) + KEY_MAP[e.code];
  keyNotes.set(e.code, midi);
  noteOn(midi);
  if (settings.mode === 'keyQuiz') answerKeyQuiz(midi);
  if (settings.mode === 'song') songJudgePress(midi, eventPerfTime(e));
});

document.addEventListener('keyup', (e) => {
  if (e.code === 'Space') { setSustain(false); return; }
  if (!keyNotes.has(e.code)) return;
  const midi = keyNotes.get(e.code);
  keyNotes.delete(e.code);
  noteOff(midi, eventPerfTime(e));
});

// ===== 操作パネル =====
function shiftOctave(delta) {
  const next = clampStart(startOctave + delta);
  if (next === startOctave) return;
  if (settings.mode === 'song') { songOctave = next; renderKeyboard(); return; }
  settings.startOctave = next;
  saveSettings();
  renderKeyboard();
}

// data-modes に書いたモードのときだけ出す。片手練習・判定つきのときだけ出す項目もある
function updateVisibility() {
  const mode = settings.mode;
  const judge = settings.songHand !== 'both' && settings.songAdvance === 'judge';
  document.querySelectorAll('[data-modes]').forEach((el) => {
    el.hidden = !el.dataset.modes.split(' ').includes(mode) ||
      ('practiceOnly' in el.dataset && settings.songHand === 'both') ||

}

  stopKeyQuiz();

  if (mode === 'nameQuiz') { releaseAll(); startQuiz(); return; }
  if (mode === 'keyQuiz') resetKeyQuizScore();
  renderKeyboard();   // 位置当てクイズのときは、この中で最初の問題を出す
}

// 五線譜に出た音符（♯なしの音）の音名を、ボタンで答える
const RECORD_KEY = 'piano-practice:quiz-records';   // 最高連続正解数（音部記号・出題範囲ごと）
const records = loadJSON(RECORD_KEY);
const NATURAL_PC = [0, 2, 4, 5, 7, 9, 11];
const ANSWER_NAMES = {
  doremi: ['ド', 'レ', 'ミ', 'ファ', 'ソ', 'ラ', 'シ'],
  cde: ['C', 'D', 'E', 'F', 'G', 'A', 'B'],
};
// 五線の外にはみ出す音の数（加線なし＝第1線のすぐ下〜第5線のすぐ上）
const QUIZ_EXT = { staff: 1, ledger1: 3, ledger2: 5 };
const OK_COLOR = '#1e8e3e';
const NG_COLOR = '#c5221f';
// PCキーボードで答える：C〜Bのキー、または1〜7
const QUIZ_KEYS = {
  KeyC: 0, KeyD: 1, KeyE: 2, KeyF: 3, KeyG: 4, KeyA: 5, KeyB: 6,
  Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Digit5: 4, Digit6: 5, Digit7: 6,
};
const diToMidi = (di) => 12 * (Math.floor(di / 7) + 1) + NATURAL_PC[di % 7];

const quizStaffEl = document.getElementById('quizStaff');
const answersEl = document.getElementById('answers');
const quiz = {
  clef: null, di: null, midi: null, answered: false,
  correct: 0, total: 0, streak: 0,
  timer: null, voiceTimer: null,
};

function startQuiz() {
  stopQuiz();
  quiz.correct = quiz.total = quiz.streak = 0;
  quiz.clef = quiz.di = null;
  renderAnswerButtons();
  nextQuestion();
}

function stopQuiz() {
  clearTimeout(quiz.timer);
  clearTimeout(quiz.voiceTimer);
}

function renderAnswerButtons() {
  answersEl.innerHTML = '';
  ANSWER_NAMES[settings.quizNames].forEach((name, step) => {
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.dataset.step = step;
    answersEl.appendChild(btn);
  });
}

function nextQuestion() {
  clearTimeout(quiz.timer);
  const clef = settings.quizClef === 'both'
    ? (Math.random() < 0.5 ? 'treble' : 'bass')
    : settings.quizClef;
  const ext = QUIZ_EXT[settings.quizRange];
  const bottomDi = CLEFS[clef].bottomDi;
  const low = bottomDi - ext;
  const high = bottomDi + 8 + ext;
  let di;
  // 同じ問題が続かないようにする
  do { di = low + Math.floor(Math.random() * (high - low + 1)); }
  while (clef === quiz.clef && di === quiz.di);
  Object.assign(quiz, { clef, di, midi: diToMidi(di), answered: false });
  answersEl.querySelectorAll('button').forEach((b) => b.classList.remove('correct', 'wrong'));
  setFeedback('この音は何？', '');
  drawQuizStaff(INK);
  updateScore();
}

function drawQuizStaff(color) {
  // 出題範囲のいちばん高い音・低い音に合わせて表示範囲を固定する（問題ごとに五線の大きさが変わらないように）
  const ext = QUIZ_EXT[settings.quizRange];
  renderStaff(quizStaffEl, [quiz.midi], quiz.clef, {
    color,
    minY: -ext * S / 2 - 2 * S,
    maxY: 4 * S + ext * S / 2 + 2 * S,
  });
}

function answerQuiz(step) {
  if (quiz.answered) return;
  quiz.answered = true;
  const right = quiz.di % 7;
  const ok = step === right;
  quiz.total++;
  if (ok) { quiz.correct++; quiz.streak++; } else quiz.streak = 0;
  updateRecord(quiz, settings.quizClef + '-' + settings.quizRange);
  const buttons = answersEl.querySelectorAll('button');
  buttons[right].classList.add('correct');
  if (!ok) buttons[step].classList.add('wrong');
  const name = NAMES_DOREMI[quiz.midi % 12] + '（' + NAMES_CDE[quiz.midi % 12] + octaveOf(quiz.midi) + '）';
  setFeedback(ok ? '正解！ ' + name : '正解は ' + name, ok ? 'ok' : 'ng');
  drawQuizStaff(ok ? OK_COLOR : NG_COLOR);
  updateScore();
  playQuizNote(quiz.midi);
  // まちがえたときは正解を確かめられるよう長めに表示してから次へ
  quiz.timer = setTimeout(nextQuestion, ok ? 800 : 2000);
}

function playQuizNote(midi) {
  clearTimeout(quiz.voiceTimer);
  if (ctx) for (const m of [...voices.keys()]) stopVoice(m, 0.03);
  startVoice(midi);
  quiz.voiceTimer = setTimeout(() => stopVoice(midi), 900);
}

function setFeedback(text, cls, id = 'quizFeedback') {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'quiz-feedback' + (cls ? ' ' + cls : '');
}

function updateScore() {
  document.getElementById('quizScore').textContent =
    scoreText(quiz, settings.quizClef + '-' + settings.quizRange);
}

// 正解数・正解率・連続正解・最高記録の表示
function scoreText(state, recordKey) {
  let text = '正解 ' + state.correct + ' / ' + state.total + '問';
  if (state.total > 0) text += '（' + Math.round(state.correct / state.total * 100) + '%）';
  return text + '　連続 ' + state.streak + '　最高 ' + (records[recordKey] || 0);
}

// 連続正解の最高記録を更新する
function updateRecord(state, recordKey) {
  if (state.streak > (records[recordKey] || 0)) {
    records[recordKey] = state.streak;
    saveJSON(RECORD_KEY, records);
  }
}

function quizKeydown(e) {
  if (!(e.code in QUIZ_KEYS)) return;
  hideOverlay();
  answerQuiz(QUIZ_KEYS[e.code]);
}

// ===== 鍵盤の位置当てクイズ =====
// 出題された音名の鍵盤を、画面の鍵盤（またはPCのキーボード）で押して答える
const keyQuiz = {
  midi: null, answered: false,
  correct: 0, total: 0, streak: 0,
  timer: null,
};

const keyQuizRecordKey = () => 'key-' + settings.keyQuizKeys + '-' + settings.keyQuizOctave;
const quizNoteName = (midi) => (settings.quizNames === 'cde' ? NAMES_CDE : NAMES_DOREMI)[midi % 12];

function resetKeyQuizScore() {
  stopKeyQuiz();
  keyQuiz.correct = keyQuiz.total = keyQuiz.streak = 0;
  keyQuiz.midi = null;
}

function stopKeyQuiz() {
  clearTimeout(keyQuiz.timer);
}

// いま画面に出ている鍵盤の音（重複なし）
function visibleMidis() {
  const set = new Set([...keyboardEl.querySelectorAll('.key')].map((el) => Number(el.dataset.midi)));
  return [...set];
}

function nextKeyQuestion() {
  clearTimeout(keyQuiz.timer);
  const exact = settings.keyQuizOctave === 'exact';
  const allowed = (m) => settings.keyQuizKeys === 'all' || !isBlack(m);
  // オクターブも当てるときは画面にある鍵盤から、そうでなければ12音（または白鍵7音）から選ぶ
  let candidates = exact
    ? visibleMidis().filter(allowed)
    : [60, 61, 62, 63, 64, 65, 66, 67, 68, 69, 70, 71].filter(allowed);
  const prev = keyQuiz.midi;
  const same = (m) => prev !== null && (exact ? m === prev : m % 12 === prev % 12);
  if (candidates.length > 1) candidates = candidates.filter((m) => !same(m));   // 同じ問題が続かないように
  keyQuiz.midi = candidates[Math.floor(Math.random() * candidates.length)];
  keyQuiz.answered = false;
  clearKeyMarks();
  updateLabels();
  const name = quizNoteName(keyQuiz.midi);
  document.getElementById('keyQuizPrompt').textContent = exact ? name + octaveOf(keyQuiz.midi) : name;
  setFeedback('この音の鍵盤をタップ', 'guide', 'keyQuizFeedback');
  updateKeyQuizScore();
}

function answerKeyQuiz(midi) {
  if (keyQuiz.answered || keyQuiz.midi === null) return;
  keyQuiz.answered = true;
  const exact = settings.keyQuizOctave === 'exact';
  const isRight = (m) => (exact ? m === keyQuiz.midi : m % 12 === keyQuiz.midi % 12);
  const ok = isRight(midi);
  keyQuiz.total++;
  if (ok) { keyQuiz.correct++; keyQuiz.streak++; } else keyQuiz.streak = 0;
  updateRecord(keyQuiz, keyQuizRecordKey());
  // 正解の鍵盤を緑、押しまちがえた鍵盤を赤にして、正解の鍵盤に音名を出す
  keyboardEl.querySelectorAll('.key').forEach((el) => {
    const m = Number(el.dataset.midi);
    if (isRight(m)) {
      el.classList.add('correct');
      el.querySelector('.key-label').textContent = quizNoteName(m) + (exact || m % 12 === 0 ? octaveOf(m) : '');
    } else if (m === midi) {
      el.classList.add('wrong');
    }
  });
  setFeedback(ok ? '正解！' : 'ざんねん… 正解は緑の鍵盤', ok ? 'ok' : 'ng', 'keyQuizFeedback');
  updateKeyQuizScore();
  // まちがえたときは正解の場所を確かめられるよう長めに表示してから次へ
  keyQuiz.timer = setTimeout(nextKeyQuestion, ok ? 800 : 2200);
}

function clearKeyMarks() {
  keyboardEl.querySelectorAll('.key.correct, .key.wrong').forEach((el) => el.classList.remove('correct', 'wrong'));
}

function updateKeyQuizScore() {
  document.getElementById('keyQuizScore').textContent = scoreText(keyQuiz, keyQuizRecordKey());
}

// ===== 曲のデータ =====
// 書き方：「音名オクターブ:拍数」をスペースで区切って並べる。「|」は小節の区切り
//   例）C4:1（ド4を1拍）  F#4:0.5（ファ♯4を半拍）  R:2（2拍休み）  C3+G3:4（ド3とソ3を同時に4拍）
//   拍数は4分音符＝1。小節の長さが拍子と合わないと、開発者ツールのコンソールに注意が出る
// 収録曲はすべて著作権の切れた曲。左手の伴奏はこのアプリ用に付けたもの
const SONGS = [

    title: 'きらきら星',
    tempo: 100,
    beatsPerBar: 4,

    left: `C3:4 | F3:2 C3:2 | F3:2 C3:2 | G2:2 C3:2 |

            E4:1 D4:1 C4:1 D4:1 | E4:1 E4:1 E4:1 E4:1 | D4:1 D4:1 E4:1 D4:1 | C4:4`,

            E4:1 E4:1 F4:1 G4:1 | G4:1 F4:1 E4:1 D4:1 | C4:1 C4:1 D4:1 E4:1 | D4:1.5 C4:0.5 C4:2 |
            D4:1 D4:1 E4:1 C4:1 | D4:1 E4:0.5 F4:0.5 E4:1 C4:1 | D4:1 E4:0.5 F4:0.5 E4:1 D4:1 | C4:1 D4:1 G3:2 |
            E4:1 E4:1 F4:1 G4:1 | G4:1 F4:1 E4:1 D4:1 | C4:1 C4:1 D4:1 E4:1 | D4:1.5 C4:0.5 C4:2`,

const NOTE_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function parseNote(text) {
  const m = /^([A-G])(#?)(\d)$/.exec(text);
  return m ? 12 * (Number(m[3]) + 1) + NOTE_PC[m[1]] + (m[2] ? 1 : 0) : null;
}

// 片手分の文字列を、音の並び { midis, beat（何拍目から）, dur（拍数）, hand } にする
function parsePart(song, hand) {
  const events = [];
  let beat = 0;
  let barStart = 0;
  let bar = 1;
  const warn = (msg) => console.warn(`曲データ「${song.title}」${hand === 'right' ? '右手' : '左手'} ${bar}小節目：${msg}`);
  const checkBar = () => {
    if (Math.abs(beat - barStart - song.beatsPerBar) > 1e-6) warn(`小節の長さが${beat - barStart}拍です`);
  };
  for (const tok of song[hand].trim().split(/\s+/)) {
    if (tok === '|') { checkBar(); barStart = beat; bar++; continue; }
    const [pitch, durText] = tok.split(':');
    const dur = Number(durText);
    if (!(dur > 0)) { warn(`「${tok}」の拍数が読めません`); continue; }
    if (pitch !== 'R') {
      const midis = pitch.split('+').map(parseNote);
      if (midis.includes(null)) warn(`「${tok}」の音名が読めません`);
      else events.push({ midis, beat, dur, hand });
    }
    beat += dur;
  }
  checkBar();
  return { events, beats: beat };
}

const parsedSongs = new Map();
function getSong(id) {
  const song = SONGS.find((s) => s.id === id) || SONGS[0];
  if (!parsedSongs.has(song.id)) {
    const r = parsePart(song, 'right');
    const l = parsePart(song, 'left');
    const totalBeats = Math.max(r.beats, l.beats);
    parsedSongs.set(song.id, {
      ...song,
      events: [...r.events, ...l.events].sort((a, b) => a.beat - b.beat),
      totalBeats,
      bars: Math.ceil(totalBeats / song.beatsPerBar - 1e-6),
    });
  }
  return parsedSongs.get(song.id);
}

const currentSong = () => getSong(settings.songId);
const songTempo = (song) => settings.songTempos[song.id] || song.tempo;

// 練習する区間（小節の番号）。保存した区間が曲の長さに合わなければ直す
function songRange(song) {
  const r = settings.songRanges[song.id] || {};
  const from = Math.min(song.bars, Math.max(1, r.from || 1));
  const to = Math.min(song.bars, Math.max(from, r.to || song.bars));
  return { from, to, whole: from === 1 && to === song.bars };
}

// 区間に入っている音と、区間の始まり・終わりの拍。区間の終わりをはみ出す音は、区間の終わりで切る
function rangeEvents(song, range = songRange(song)) {
  const start = (range.from - 1) * song.beatsPerBar;
  const end = Math.min(song.totalBeats, range.to * song.beatsPerBar);
  const events = song.events
    .filter((e) => e.beat >= start - 1e-6 && e.beat < end - 1e-6)
    .map((e) => (e.beat + e.dur > end ? { ...e, dur: end - e.beat } : e));
  return { start, end, events };
}

// 鍵盤の位置（下段の左端のオクターブ）を、曲の音がいちばん多く入る位置にする
// 2段のときは、右手の音は下段、左手の音は上段に入っている数で比べる
// 片手練習のときは、練習する手の音を優先する（10倍の重みで数える）。区間を決めているときは区間の音だけで数える
function fitOctaveForSong() {
  const events = rangeEvents(currentSong()).events;
  const practice = settings.songHand === 'both' ? null : settings.songHand;
  const inRange = (m, lowOct) => m >= 12 * (lowOct + 1) && m <= 12 * (lowOct + 1 + octaves);
  let best = null;
  let bestCount = -1;
  for (let o = 1; o <= 7; o++) {
    if (clampStart(o) !== o) continue;
    let count = 0;
    for (const ev of events) {
      for (const m of ev.midis) {
        const weight = practice && ev.hand === practice ? 10 : 1;
        if (rows === 2) count += inRange(m, ev.hand === 'right' ? o : o - octaves) ? weight : 0;
        else count += inRange(m, o) ? weight : 0;
      }
    }
    if (count > bestCount) { best = o; bestCount = count; }
  }
  return best ?? 4;
}

// ===== お手本再生＋光る鍵盤 =====
// 音は Web Audio API の時刻で少し先まで予約して鳴らす（タイマーのずれの影響を受けないように）
const SCHEDULE_AHEAD = 0.12;   // 何秒先まで予約するか
const player = {
  playing: false,
  song: null,
  tempo: 100,
  // 区間：曲全体か、指定した小節だけ。くり返すときは、拍を区間の長さ（len）ずつ足して数える
  //   （2回目の区間の始まり＝ start + len 拍目。音の拍＝曲の中の拍 + 何回目 × len）
  events: [],          // 区間に入っている音
  start: 0,            // 区間の始まりの拍
  end: 0,              // 区間の終わりの拍
  len: 0,
  loop: false,         // 区間をくり返すか
  whole: true,         // 曲全体か
  idx: 0,              // 次に予約する音の番号
  pass: 0,             // 次に予約する音が何回目の区間か（0から数える）
  anchorTime: 0,       // テンポの基準：この時刻に anchorBeat 拍目
  anchorBeat: 0,
  scheduled: [],       // 予約した音（停止したときに消すため）
  timer: null,
  raf: null,
  lastStatus: '',
  // 片手練習
  practice: null,      // 練習する手（right / left）。両手なら null
  wait: false,         // 弾くまで待つか
  muteOther: false,    // もう片方の手を鳴らさないか
  steps: [],           // 練習する手の「弾くところ」：{ beat, midis }（同じ拍の音はまとめる）
  stepIdx: 0,          // 次に弾くところの番号
  stepPass: 0,         // 次に弾くところが何回目の区間か
  passMissStart: 0,    // いまの回が始まったときのミスの数
  lastPassMisses: null,  // 前の回のミスの数
  pressed: new Set(),  // 次に弾くところのうち、もう押した音（和音は全部押したら進む）
  misses: 0,
  // 判定つき（タイミングを判定する）
  judge: false,
  g: 0,                // まだ終わっていない最初の「弾くところ」の通し番号（くり返しの回をまたいで数える）
  jstate: new Map(),   // 通し番号 → { pressed: Set（押した音）, missed: true（判定の幅を過ぎた）}
  counts: null,        // 今回の判定の数 { perfect, great, good, miss }
  passStart: null,     // いまの回が始まったときの counts
  lastPassAcc: null,   // 前の回の正確さ
  showAfter: 0,        // 次に弾く鍵盤を光らせ始める時刻（同じ鍵盤が続くときに光り直して見えるように）
  result: null,        // 最後の回の結果（止まったときに表示）
  // 音の長さの判定
  holding: new Map(),  // 押している鍵盤 → { start: 押した時刻（ミリ秒）, expected: 楽譜の長さ（秒）}
  lengths: null,       // 今回の音の長さの判定の数 { just, short, long }
};
const lit = new Map();   // 光らせている鍵盤：midi → 'right' / 'left'

const beatToTime = (beat) => player.anchorTime + (beat - player.anchorBeat) * 60 / player.tempo;
const timeToBeat = (time) => player.anchorBeat + (time - player.anchorTime) * player.tempo / 60;

// 次に弾くところ（拍はくり返しの回数を足したもの）。くり返すときは、区間の最後まで弾いたら最初に戻る
function currentStep() {
  if (!player.wait) return undefined;
  if (player.stepIdx >= player.steps.length && player.loop && player.steps.length) {
    player.stepIdx = 0;
    player.stepPass++;
    player.lastPassMisses = player.misses - player.passMissStart;
    player.passMissStart = player.misses;
  }
  const s = player.steps[player.stepIdx];
  return s && { beat: s.beat + player.stepPass * player.len, midis: s.midis };
}

// 次に予約する音の拍（くり返しの回数を足したもの）。もうなければ Infinity
function peekBeat() {
  if (player.idx >= player.events.length) {
    if (!player.loop || !player.events.length) return Infinity;
    player.idx = 0;
    player.pass++;
  }
  return player.events[player.idx].beat + player.pass * player.len;
}

// いまの拍。弾くまで待つときは次に弾くところで、判定つきのときはまだ弾いていない音の判定の幅の終わりで止まる
function playbackBeat(time) {
  const beat = timeToBeat(time);
  const cap = player.judge ? judgeCapBeat() : currentStep()?.beat;
  return cap !== undefined && beat > cap ? cap : beat;
}

// 練習する手の音を、同じ拍ごとにまとめる
function buildSteps(events, hand) {
  const steps = [];
  for (const ev of events) {
    if (ev.hand !== hand) continue;
    const last = steps[steps.length - 1];
    // durs：それぞれの音の長さ（拍）。音の長さの判定に使う
    if (last && Math.abs(last.beat - ev.beat) < 1e-6) {
      last.midis.push(...ev.midis);
      last.durs.push(...ev.midis.map(() => ev.dur));
    } else {
      steps.push({ beat: ev.beat, midis: [...ev.midis], durs: ev.midis.map(() => ev.dur) });
    }
  }
  return steps;
}

function startPlayback() {
  initAudio();
  const song = currentSong();
  const practice = settings.songHand === 'both' ? null : settings.songHand;
  const wait = !!practice && settings.songAdvance === 'wait';
  const judge = !!practice && settings.songAdvance === 'judge';
  const range = songRange(song);
  const { start, end, events } = rangeEvents(song, range);
  Object.assign(player, {
    playing: true,
    song,
    tempo: songTempo(song),
    events,
    start,
    end,
    len: end - start,
    loop: settings.songLoop,
    whole: range.whole,
    idx: 0,
    pass: 0,
    // 判定つきのときは、1小節分のカウントを入れてから始める
    anchorTime: ctx.currentTime + 0.15,
    anchorBeat: judge ? start - song.beatsPerBar : start,
    scheduled: [],
    practice,
    wait,
    judge,
    muteOther: !!practice && settings.songOther === 'mute',
    steps: wait || judge ? buildSteps(events, practice) : [],
    stepIdx: 0,
    stepPass: 0,
    passMissStart: 0,
    lastPassMisses: null,
    pressed: new Set(),
    misses: 0,
    g: 0,
    jstate: new Map(),
    counts: { perfect: 0, great: 0, good: 0, miss: 0 },
    passStart: { perfect: 0, great: 0, good: 0, miss: 0 },
    lastPassAcc: null,
    showAfter: 0,
    result: null,
    counting: judge,
    holding: new Map(),
    lengths: { just: 0, short: 0, long: 0 },
  });
  if (judge) {
    for (let i = 0; i < song.beatsPerBar; i++) playClick(beatToTime(start - song.beatsPerBar + i), i === 0);
    setJudgeText('', '');
    setLengthText('', '');
  }
  playBtn.textContent = '■ 停止';
  playBtn.classList.add('playing');
  schedule();
  player.timer = setInterval(schedule, 25);
  player.raf = requestAnimationFrame(drawPlayback);
}

// finished：曲の最後まで行って止まったとき
function stopPlayback(finished = false) {
  if (!player.playing) return;
  // 最後まで弾いて止まったとき、まだ押している音は、いまの時点の長さで判定する（短めにはしない）
  if (finished && player.judge) {
    for (const [, h] of player.holding) {
      const grade = lengthGrade((performance.now() - h.start) / 1000, h.expected);
      player.lengths[grade === 'short' ? 'just' : grade]++;
    }
  }
  player.holding.clear();
  player.playing = false;
  clearInterval(player.timer);
  cancelAnimationFrame(player.raf);
  // 予約済みの音・鳴っている音をすぐに消す
  if (ctx) {
    const now = ctx.currentTime;
    for (const v of player.scheduled) {
      if (v.end <= now) continue;
      const g = v.out.gain;
      g.cancelScheduledValues(now);
      g.setValueAtTime(g.value, now);
      g.setTargetAtTime(0, now, 0.02);
      v.oscs.forEach((o) => { try { o.stop(now + 0.2); } catch (e) {} });
    }
  }
  player.scheduled = [];
  setLit(new Map());
  playBtn.textContent = '▶ 再生';
  playBtn.classList.remove('playing');
  showSong();
  if (finished && player.wait) {
    setSongStatus(`${player.whole ? '最後まで' : '区間を'}弾けました！　ミス ${player.misses}回`);
  }
  if (finished && player.judge && player.result) {
    const r = player.result;
    setSongStatus(`パーフェクト ${r.perfect}　グレート ${r.great}　グッド ${r.good}　ミス ${r.miss}`);
    setJudgeText(`正確さ ${r.acc}%`, r.newRecord ? 'j-perfect' : '', r.newRecord ? '新記録！' : r.best !== undefined ? `最高 ${r.best}%` : '');
    const l = player.lengths;
    if (l.just + l.short + l.long) setLengthText(`音の長さ　ちょうど ${l.just}　短め ${l.short}　長め ${l.long}`, 'j-info');
  }
}

function schedule() {
  if (!player.playing || !ctx) return;
  const now = ctx.currentTime;
  // 弾くまで待つときは、次に弾くところより前の音だけ予約する（同じ拍の音は、弾いたときに鳴らす）
  // 判定つきのときは、まだ弾いていない音の判定の幅の終わりまでだけ予約する（大きく遅れたら止まって待つ）
  if (player.judge) judgeUpdate();
  const step = currentStep();
  const cap = player.judge ? judgeCapBeat() : undefined;
  const limit = step ? step.beat - 1e-6 : cap !== undefined ? cap : Infinity;
  for (let b = peekBeat(); b < limit && beatToTime(b) < now + SCHEDULE_AHEAD; b = peekBeat()) {
    const ev = player.events[player.idx++];
    // 練習する手の音は鳴らさない（自分で弾く）。もう片方を鳴らさない設定ならそれも鳴らさない
    if (ev.hand === player.practice || player.muteOther) continue;
    const t = Math.max(now, beatToTime(b));
    // 同じ音が続いても聞き分けられるよう、少しだけ短く鳴らす
    const dur = Math.max(0.05, ev.dur * 60 / player.tempo - 0.03);
    ev.midis.forEach((m) => playScheduled(m, t, dur));
  }
  player.scheduled = player.scheduled.filter((v) => v.end > now);
  // くり返さないときは、区間の終わりまで行ったら止める（くり返すときは停止ボタンで止める）
  if (!player.loop && peekBeat() === Infinity && !step && !judgeStep(player.g) &&
      now > beatToTime(player.end) + 0.3) stopPlayback(true);
}

function playScheduled(midi, t, dur) {
  const v = TONES[settings.tone](midiToFreq(midi), t);
  v.out.connect(master);
  const end = t + dur;
  v.out.gain.setValueAtTime(1, end);
  v.out.gain.setTargetAtTime(0, end, v.release);
  const stopAt = Math.min(end + v.release * 8, t + v.maxDur);
  v.oscs.forEach((o) => o.stop(stopAt));
  v.oscs[0].onended = () => v.out.disconnect();
  player.scheduled.push({ out: v.out, oscs: v.oscs, end: stopAt });
}

// カウント・タイミング調整のクリック音（短い「プッ」）。accent：1拍目は高めの音
function makeClick(t, accent) {
  const o = osc('sine', accent ? 1760 : 1320, t);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.5, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  o.connect(g);
  g.connect(master);
  o.stop(t + 0.07);
  o.onended = () => g.disconnect();
  return { out: g, oscs: [o], end: t + 0.07 };
}
function playClick(t, accent) {
  player.scheduled.push(makeClick(t, accent));
}

// ===== タイミングの判定（判定つき） =====
// 押した時刻は、イベントの timeStamp（押した瞬間）を「その瞬間にスピーカーから出ていた音の時刻」に直して、
// 予約した音の時刻と比べる。さらにタイミング調整で測った、この端末の遅れを差し引く
function audioTimeAt(perfMs) {
  if (ctx.getOutputTimestamp) {
    const ts = ctx.getOutputTimestamp();
    if (ts.performanceTime > 0 && ts.contextTime > 0) return ts.contextTime + (perfMs - ts.performanceTime) / 1000;
  }
  const latency = ctx.outputLatency || ctx.baseLatency || 0;
  return ctx.currentTime - latency - (performance.now() - perfMs) / 1000;
}
// イベントの timeStamp が performance.now() と同じ基準でない環境に備える
function eventPerfTime(e) {
  const now = performance.now();
  const t = e && e.timeStamp;
  return t > 0 && t <= now + 5 && now - t < 1000 ? t : now;
}

// 判定の幅（秒）。速い曲で幅が音の間隔より広くならないよう、半拍を上限にする
function judgeWindows() {
  const half = 30 / player.tempo;
  const good = Math.min(0.2, half);
  const great = Math.min(0.12, good);
  return { good, great, perfect: Math.min(0.06, great) };
}
const JUDGE_NAMES = { perfect: 'パーフェクト', great: 'グレート', good: 'グッド', miss: 'ミス' };
const JUDGE_SCORE = { perfect: 100, great: 70, good: 40, miss: 0 };

// 通し番号 g の「弾くところ」。拍はくり返しの回数を足したもの。くり返さないときは区間の最後まで
function judgeStep(g) {
  const n = player.steps.length;
  if (!player.judge || !n || (!player.loop && g >= n)) return undefined;
  const s = player.steps[g % n];
  return { beat: s.beat + Math.floor(g / n) * player.len, midis: s.midis, durs: s.durs };
}
function judgeState(g) {
  if (!player.jstate.has(g)) player.jstate.set(g, { pressed: new Set(), missed: false });
  return player.jstate.get(g);
}
// まだ弾き終わっていない最初の音の、判定の幅の終わりの拍（ここで止まって待つ）
function judgeCapBeat() {
  const st = judgeStep(player.g);
  return st && st.beat + judgeWindows().good * player.tempo / 60;
}

// 25ミリ秒ごと：弾き終わった音を進め、判定の幅を過ぎても弾いていない音をミスにする
function judgeUpdate() {
  const nowT = audioTimeAt(performance.now()) - settings.timingOffset;
  for (let st = judgeStep(player.g); st; st = judgeStep(player.g)) {
    const state = judgeState(player.g);
    if (st.midis.every((m) => state.pressed.has(m))) { finishJudgeStep(); continue; }
    if (!state.missed && nowT > beatToTime(st.beat) + judgeWindows().good) {
      state.missed = true;
      for (const m of st.midis) if (!state.pressed.has(m)) addJudge('miss');
      showJudge('miss');
    }
    break;
  }
}

// いちばん前の「弾くところ」を弾き終えた。区間の最後なら、その回の成績をまとめる
function finishJudgeStep() {
  const g = player.g;
  player.jstate.delete(g);
  player.g++;
  if (g % player.steps.length === player.steps.length - 1) finishJudgePass();
}

function judgeAccuracy(c) {
  const total = c.perfect + c.great + c.good + c.miss;
  if (!total) return null;
  return Math.round((c.perfect * JUDGE_SCORE.perfect + c.great * JUDGE_SCORE.great + c.good * JUDGE_SCORE.good) / total);
}

// 区間を1回弾き終えた：その回の正確さを最高記録と比べて保存する
const SONG_RECORD_KEY = 'piano-practice:song-records';   // 曲・練習する手・区間ごとの最高の正確さ（％）
const songRecords = loadJSON(SONG_RECORD_KEY);
function songRecordKey() {
  const r = songRange(currentSong());
  return `${currentSong().id}:${settings.songHand}:${r.from}-${r.to}`;
}
function finishJudgePass() {
  const c = {};
  for (const k of Object.keys(player.counts)) c[k] = player.counts[k] - player.passStart[k];
  const acc = judgeAccuracy(c);
  player.passStart = { ...player.counts };
  if (acc === null) return;
  const key = songRecordKey();
  const best = songRecords[key];
  const newRecord = best === undefined || acc > best;
  if (newRecord) { songRecords[key] = acc; saveJSON(SONG_RECORD_KEY, songRecords); }
  player.lastPassAcc = acc;
  player.result = { ...c, acc, best, newRecord };
}

function addJudge(grade) {
  player.counts[grade]++;
}

// 判定の表示：いちばん新しい判定と、はやい・おそい
function showJudge(grade, delta) {
  const sub = grade === 'miss' || grade === 'perfect' || delta === undefined ? '' : delta < 0 ? 'はやい' : 'おそい';
  setJudgeText(JUDGE_NAMES[grade], 'j-' + grade, sub, true);
}
// pop：判定のたびに少し大きく出す（同じ判定が続いても、弾いたことがわかるように）
function setJudgeText(text, cls, sub = '', pop = false) {
  const el = document.getElementById('songJudge');
  const key = text + '|' + cls + '|' + sub;
  if (!pop && el.dataset.key === key) return;
  el.dataset.key = key;
  el.className = '';
  if (pop) void el.offsetWidth;   // アニメーションを最初からやり直す
  el.className = cls + (pop ? ' pop' : '');
  el.textContent = text;
  if (sub) {
    const span = document.createElement('span');
    span.className = 'sub';
    span.textContent = sub;
    el.appendChild(span);
  }
}

// ===== 音の長さの判定（判定つき） =====
// 押していた時間を、楽譜の長さ（秒）と比べる。タイミングの判定とは別に出し、正確さ（％）には入れない
// ピアノは音の長さの許容が広いので、ゆるめにする：
//   短め＝楽譜の長さの半分より短く、かつ0.1秒以上足りない
//   長め＝楽譜の長さの1.3倍より長く、かつ0.15秒以上はみ出す
// 長さは「押した瞬間と離した瞬間の差」なので、端末の遅れ（タイミング調整の値）は差し引かなくてよい
function lengthGrade(held, expected) {
  if (held < expected * 0.5 && expected - held > 0.1) return 'short';
  if (held > expected * 1.3 && held - expected > 0.15) return 'long';
  return 'just';
}
const LENGTH_NAMES = { just: 'ちょうど', short: '短め', long: '長め' };

function songLengthRelease(midi, perfMs) {
  if (!player.playing || !player.judge) return;
  const h = player.holding.get(midi);
  if (!h) return;
  player.holding.delete(midi);
  const grade = lengthGrade((perfMs - h.start) / 1000, h.expected);
  player.lengths[grade]++;
  setLengthText(`長さ ${LENGTH_NAMES[grade]}`, grade === 'just' ? 'len-just' : 'len-off', true);
}

function setLengthText(text, cls, pop = false) {
  const el = document.getElementById('songLength');
  el.className = '';
  if (pop) void el.offsetWidth;   // アニメーションを最初からやり直す
  el.className = cls + (pop ? ' pop' : '');
  el.textContent = text;
}

// 判定つきで鍵盤が押されたとき（指が触れた瞬間・PCのキーを押した瞬間だけ。指を滑らせて移った鍵盤は判定しない）
// いちばん近い時刻の「弾くところ」の音として判定する。どれにも当たらなければミス
function songJudgePress(midi, perfMs) {
  if (!player.playing || !player.judge || !ctx) return;
  judgeUpdate();
  const pressT = audioTimeAt(perfMs) - settings.timingOffset;
  const win = judgeWindows();
  const visible = new Set(visibleMidis());
  const matchOf = (st, state) => st.midis.find((m) =>
    !state.pressed.has(m) && (m === midi || (!visible.has(m) && m % 12 === midi % 12)));
  // 止まって待っているときは、待っている音だけを受け付ける（もうミスになっているので、弾いたら先へ進むだけ）
  const first = judgeStep(player.g);
  if (first && judgeState(player.g).missed) {
    const state = judgeState(player.g);
    const m = matchOf(first, state);
    if (m === undefined) { addJudge('miss'); showJudge('miss'); return; }
    state.pressed.add(m);
    if (first.midis.every((x) => state.pressed.has(x))) {
      // 止まっていたところから再開する
      const cap = judgeCapBeat();
      player.anchorBeat = Math.min(cap, timeToBeat(ctx.currentTime));
      player.anchorTime = ctx.currentTime;
      player.showAfter = performance.now() + 120;
      finishJudgeStep();
      schedule();
    }
    return;
  }
  let best = null;
  for (let g = player.g, st = judgeStep(g); st; st = judgeStep(++g)) {
    const t = beatToTime(st.beat);
    if (t - win.good > pressT) break;
    const state = judgeState(g);
    const m = matchOf(st, state);
    if (m === undefined) continue;
    const delta = pressT - t;
    if (Math.abs(delta) <= win.good && (!best || Math.abs(delta) < Math.abs(best.delta))) best = { g, m, delta };
  }
  if (!best) { addJudge('miss'); showJudge('miss'); return; }
  const ad = Math.abs(best.delta);
  const grade = ad <= win.perfect ? 'perfect' : ad <= win.great ? 'great' : 'good';
  judgeState(best.g).pressed.add(best.m);
  addJudge(grade);
  showJudge(grade, best.delta);
  // 音の長さ：離したときに、押していた時間を楽譜の長さと比べる（ミスの音は判定しない）
  const st = judgeStep(best.g);
  player.holding.set(midi, { start: perfMs, expected: st.durs[st.midis.indexOf(best.m)] * 60 / player.tempo });
  player.showAfter = performance.now() + 120;
  judgeUpdate();
}

// 曲の練習中に鍵盤が押されたとき（弾くまで待つ練習の判定）
// 光っている鍵盤と同じ音なら正解。その鍵盤が画面に入っていないときは、同じ音名の鍵盤でも正解にする
function songNoteOn(midi) {
  const step = currentStep();
  if (!player.playing || !step || !ctx) return;
  const visible = new Set(visibleMidis());
  const match = step.midis.find((m) => m === midi || (!visible.has(m) && m % 12 === midi % 12));
  if (match === undefined) {
    if (!step.midis.some((m) => player.pressed.has(m) && m % 12 === midi % 12)) player.misses++;
    return;
  }
  player.pressed.add(match);
  if (!step.midis.every((m) => player.pressed.has(m))) return;
  // 全部押せたので次へ。早めに弾いたときは、その位置まで進める（間の伴奏は飛ばす）
  while (peekBeat() < step.beat - 1e-6) player.idx++;
  player.anchorBeat = step.beat;
  player.anchorTime = ctx.currentTime;
  player.stepIdx++;
  player.pressed.clear();
  schedule();   // 同じ拍のもう片方の手の音を、すぐ鳴らす
}

// 画面の更新：いま鳴っている音の鍵盤を光らせ、小節を表示する
function drawPlayback() {
  if (!player.playing) return;
  // スピーカーから実際に音が出るまでの遅れの分だけ、表示を遅らせる
  const latency = ctx.outputLatency || ctx.baseLatency || 0;
  const vbeat = playbackBeat(ctx.currentTime - latency);
  // 何回目の区間か（0から）と、曲の中の拍
  const pass = player.loop ? Math.max(0, Math.floor((vbeat - player.start) / player.len + 1e-6)) : 0;
  const beat = vbeat - pass * player.len;
  const step = currentStep();
  const next = new Map();
  for (const ev of player.events) {
    if (ev.beat > beat) break;
    if ((player.wait || player.judge) && ev.hand === player.practice) continue;   // 練習する手は「次に弾く鍵盤」として下で光らせる
    if (step && ev.beat + pass * player.len >= step.beat - 1e-6) continue;   // 次に弾くところと同じ拍の音は、弾いてから鳴るので、まだ光らせない
    // 同じ音が続くときに光り直して見えるよう、音の長さの9割だけ光らせる
    if (beat < ev.beat + ev.dur * 0.9) {
      for (const m of ev.midis) if (next.get(m) !== 'right') next.set(m, ev.hand);
    }
  }
  // 弾くまで待つ：次に弾く鍵盤（まだ押していない音）を光らせる。練習する手の色を優先
  if (step) for (const m of step.midis) if (!player.pressed.has(m)) next.set(m, player.practice);
  // 判定つき：次に弾く鍵盤（まだ押していない音）を光らせる。弾いた直後は少しだけ消して、同じ鍵盤が続いてもわかるようにする
  const jst = judgeStep(player.g);
  if (jst && performance.now() >= player.showAfter) {
    const state = judgeState(player.g);
    for (const m of jst.midis) if (!state.pressed.has(m)) next.set(m, player.practice);
  }
  setLit(next);
  const song = player.song;
  const firstBar = player.start / song.beatsPerBar + 1;
  const lastBar = Math.ceil(player.end / song.beatsPerBar - 1e-6);
  const bar = Math.min(lastBar, Math.max(firstBar, Math.floor(beat / song.beatsPerBar + 1e-6) + 1));
  // 判定つきは正確さを出すので、横に長くならないようテンポは出さない（テンポは操作パネルに出ている）
  let text = `${bar} / ${song.bars} 小節` + (player.judge ? '' : `　♩=${player.tempo}`);
  if (player.loop) {
    // くり返すときは、何回目かと、この回のミス（弾くまで待つとき）を出す
    text += `　${(player.wait ? player.stepPass : pass) + 1}回目`;
    if (player.wait) {
      text += `　ミス ${player.misses - player.passMissStart}`;
      if (player.lastPassMisses !== null) text += `（前回 ${player.lastPassMisses}）`;
    }
  } else if (player.wait) {
    text += `　ミス ${player.misses}`;
  }
  if (player.judge) {
    // 正確さ：くり返すときはこの回の分と、前の回の分
    const c = {};
    for (const k of Object.keys(player.counts)) c[k] = player.counts[k] - (player.loop ? player.passStart[k] : 0);
    const acc = judgeAccuracy(c);
    if (acc !== null) text += `　正確さ ${acc}%`;
    if (player.loop && player.lastPassAcc !== null) text += `（前回 ${player.lastPassAcc}%）`;
  }
  if (player.judge) {
    // カウント中は「1・2・3・4」を出す（まだ何も判定していないときだけ）
    if (player.counting) {
      const countStart = player.start - song.beatsPerBar;
      const judged = judgeAccuracy(player.counts) !== null;
      if (vbeat >= player.start || judged) {
        player.counting = false;
        if (!judged) setJudgeText('', '');
      } else {
        setJudgeText(vbeat < countStart ? '' : `カウント ${Math.floor(vbeat - countStart) + 1}`, 'j-info');
      }
    }
  }
  setSongStatus(text);
  player.raf = requestAnimationFrame(drawPlayback);
}

function setLit(next) {
  const apply = (m, hand) => {
    keyboardEl.querySelectorAll('[data-midi="' + m + '"]').forEach((el) => {
      el.classList.toggle('demo-right', hand === 'right');
      el.classList.toggle('demo-left', hand === 'left');
    });
  };
  for (const m of lit.keys()) if (!next.has(m)) apply(m, null);
  for (const [m, hand] of next) if (lit.get(m) !== hand) apply(m, hand);
  lit.clear();
  for (const [m, hand] of next) lit.set(m, hand);
}

function setSongStatus(text) {
  if (text === player.lastStatus) return;
  player.lastStatus = text;
  document.getElementById('songStatus').textContent = text;
}

// 停止中の表示：曲名・小節数・テンポ。鍵盤に入りきらない音があれば知らせる
function showSong() {
  const song = currentSong();
  document.getElementById('songTitle').textContent = song.title;
  songSelect.value = song.id;
  tempoInput.value = songTempo(song);
  document.getElementById('tempoLabel').textContent = '♩=' + songTempo(song);
  const hand = settings.songHand;
  const range = songRange(song);
  showRange(song, range);
  const keys = new Set(visibleMidis());
  const outside = keys.size > 0 && rangeEvents(song, range).events.some((e) =>
    (hand === 'both' || e.hand === hand) && e.midis.some((m) => !keys.has(m)));
  const bars = range.whole ? `全${song.bars}小節` : `${range.from}〜${range.to}小節（全${song.bars}小節）`;
  setSongStatus(`${bars}　♩=${songTempo(song)}` + (outside ? '　※鍵盤に入りきらない音があります' : ''));
  handSelect.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.hand === hand));
  document.getElementById('songHint').textContent = songHintText();
  // 判定つきのときだけ判定の行を出す。止まっているときは最高記録を出す
  const judge = hand !== 'both' && settings.songAdvance === 'judge';
  const judgeEl = document.getElementById('songJudge');
  // 判定つきのときは、色の見本（右手・左手）の代わりに音の長さの判定の行を出す（スマホ横向きで高さが増えないように）
  document.getElementById('songLength').hidden = !judge;
  document.querySelector('.song-legend').hidden = judge;
  if (judge === judgeEl.hasAttribute('data-off')) {
    judgeEl.toggleAttribute('data-off', !judge);
    requestAnimationFrame(refitKeyboard);   // 表示エリアの高さが変わるので、鍵盤の大きさを合わせ直す
  }
  if (judge) {
    const best = songRecords[songRecordKey()];
    setJudgeText(best !== undefined ? `最高記録 ${best}%` : '記録なし', 'j-info');
    setLengthText('音の長さも判定します', 'j-info');
  }
  document.getElementById('calibLabel').textContent = calibText(settings.timingOffset);
}

function songHintText() {
  const hand = settings.songHand;
  if (hand === 'both') return 'お手本を聴く：鳴っている音の鍵盤が光ります';
  const name = hand === 'right' ? '右手' : '左手';
  const other = settings.songOther === 'play' ? '（もう片方の手は自動で鳴ります）' : '';
  if (settings.songAdvance === 'wait') {
    return `${name}を練習：光った鍵盤を弾くと進みます${other}`;
  }
  if (settings.songAdvance === 'judge') {
    return `${name}を練習：光った鍵盤をテンポに合わせて弾くと判定します${other}`;
  }
  return `${name}を練習：光る鍵盤に合わせて弾いてください${other}`;
}

const songSelect = document.getElementById('songSelect');
const tempoInput = document.getElementById('tempoInput');
const playBtn = document.getElementById('playBtn');
const handSelect = document.getElementById('handSelect');
for (const song of SONGS) {

  opt.value = song.id;
  opt.textContent = song.title;
  songSelect.appendChild(opt);
}

songSelect.addEventListener('change', () => {

});

handSelect.addEventListener('click', (e) => {

for (const [id, prop] of [['songAdvanceSelect', 'songAdvance'], ['songOtherSelect', 'songOther']]) {
